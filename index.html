<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaga Arcade - Pixel Perfect Edition</title>
    <style>
        :root {
            --arcade-black: #000000;
            --arcade-red: #ff0000;
            --arcade-cyan: #00ffff;
            --arcade-yellow: #ffff00;
            --arcade-pink: #ff00ff;
            --arcade-blue: #2b2bff;
            --arcade-white: #ffffff;
            --arcade-green: #00ff00;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #080808;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            padding: 10px;
            background: #151515;
            border-radius: 8px;
            border: 4px solid #222;
            box-shadow: 0 0 80px rgba(0,0,0,1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 448px;
            height: 512px;
            background: var(--arcade-black);
            overflow: hidden;
            outline: 2px solid #000;
        }

        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 25;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute;
            top: 5px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 0 15px;
            z-index: 30;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
        }

        .red-text { color: var(--arcade-red); }
        .white-text { color: var(--arcade-white); }
        
        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            text-align: center;
        }

        #start-btn {
            margin-top: 30px;
            background: none;
            border: 2px solid var(--arcade-cyan);
            color: var(--arcade-cyan);
            padding: 10px 25px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
        }

        #controls-wrapper {
            margin-top: 20px;
            width: 100%;
            max-width: 448px;
            display: none;
            justify-content: space-between;
            padding: 0 15px;
        }

        .t-btn {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.05);
            border: 2px solid #333;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px;
            color: #666;
        }

        @media (max-width: 600px) {
            #game-wrapper { padding: 0; border: none; }
            #game-container { width: 100vw; height: calc(100vw * (512/448)); }
            #controls-wrapper { display: flex; }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <div id="ui-layer">
                <div><div class="red-text">1UP</div><div id="score-display" class="white-text">00</div></div>
                <div><div class="red-text">HIGH SCORE</div><div id="high-score" class="white-text">20000</div></div>
                <div><div class="red-text">LIVES</div><div id="lives-display" class="white-text">3</div></div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div id="menu-overlay">
                <h1 id="menu-title" style="color:var(--arcade-red); font-style:italic; font-size:3.5rem; margin:0; text-shadow:3px 3px 0 var(--arcade-blue);">Galaga</h1>
                <p id="menu-sub" style="color:var(--arcade-cyan); letter-spacing:5px;">AUTHENTIC REPLICA</p>
                <button id="start-btn">START GAME</button>
            </div>
        </div>
        <div id="controls-wrapper">
            <div style="display: flex; gap: 20px;">
                <div class="t-btn" id="l-btn">←</div>
                <div class="t-btn" id="r-btn">→</div>
            </div>
            <div class="t-btn" id="f-btn" style="border-color: var(--arcade-red); color: var(--arcade-red);">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 448, HEIGHT = 512, SCALE = 2;

        let audioCtx = null;
        function playSfx(freq, type = 'square', duration = 0.1) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const PALETTE = { 'W': '#FFF', 'R': '#F00', 'B': '#2B2BFF', 'Y': '#FF0', 'P': '#F0F', 'C': '#0FF', 'G': '#0F0', 'D': '#555', '.': 'transparent' };
        const SPRITES = {
            player: [
                ".......WW.......",
                ".......WW.......",
                "......WRRW......",
                "......WRRW......",
                "......WBBW......",
                "......WBBW......",
                ".....WWWWWW.....",
                "...WWWWWWWWWW...",
                "..WWWWWWWWWWWW..",
                "..WWRRWWWWWRRW..",
                "..WWRRWWWWWRRW..",
                "WWWWWWWWWWWWWWWW",
                "WWWWWWWWWWWWWWWW",
                "RR.RR......RR.RR",
                "RR.RR......RR.RR",
                "R...R......R...R"
            ],
            bee: [
                [
                    "....YY....YY....",
                    "...YYYY..YYYY...",
                    "...YYYYBBYYYY...",
                    "....YYBBBBYY....",
                    ".....BBBBBB.....",
                    ".....BBBBBB.....",
                    ".....BBRRBB.....",
                    ".....BBRRBB.....",
                    "......BBBB......",
                    "......BBBB......",
                    ".....BB..BB.....",
                    ".....BB..BB.....",
                    "....BB....BB....",
                    "....BB....BB....",
                    "...BB......BB...",
                    "................"
                ],
                [
                    "................",
                    "....YY....YY....",
                    "...YYYYBBYYYY...",
                    "..YYYYBBBBYYYY..",
                    "..YYYYBBBBYYYY..",
                    "...YYBBBBBBYY...",
                    ".....BBBBBB.....",
                    ".....BBBBBB.....",
                    ".....BBRRBB.....",
                    ".....BBRRBB.....",
                    "......BBBB......",
                    "......BBBB......",
                    ".....BB..BB.....",
                    ".....BB..BB.....",
                    "....BB....BB....",
                    "....BB....BB...."
                ]
            ],
            butterfly: [
                [
                    "....PP....PP....",
                    "...PPPP..PPPP...",
                    "..PPPPWWPPPP....",
                    "...PPWWWWPP.....",
                    "....WWBBWW......",
                    "....WWBBWW......",
                    "...WWWWWWWW.....",
                    "..WWWWWWWWWW....",
                    "..WWWWWWWWWW....",
                    "...WWWWWWWW.....",
                    "...WWWWWWWW.....",
                    "....WWWWWW......",
                    "....WWWWWW......",
                    "...WW....WW.....",
                    "...W......W.....",
                    "................"
                ],
                [
                    "................",
                    "....PP....PP....",
                    "...PPPPWWPPPP...",
                    "..PPPPWWWWPPPP..",
                    "..PPPPWWWWPPPP..",
                    "...PPWWBBWWPP...",
                    "....WWBBWW......",
                    "....WWBBWW......",
                    "....WWWWWW......",
                    "...WWWWWWWW.....",
                    "...WWWWWWWW.....",
                    "..WWWWWWWWWW....",
                    "..WWWWWWWWWW....",
                    "...WWWWWWWW.....",
                    "...WWWWWWWW.....",
                    "....WWWWWW......"
                ]
            ],
            boss: [
                [
                    "....GG....GG....",
                    "...GGGG..GGGG...",
                    "..GGGGCBCGGGG...",
                    "...GGCCCCCXG....",
                    "....CCCCCC......",
                    "....CCRRCC......",
                    "...CCRRRRCC.....",
                    "..CCCCRRCCCC....",
                    "..CCCCRRCCCC....",
                    "...CCRRRRCC.....",
                    "...CCRRRRCC.....",
                    "....CCRRCC......",

                    "...C......C.....",
                    "................"
                ],
                [
                    "................",
                    "....GG....GG....",
                    "...GGGGCBCGGGG...",
                    "..GGGGCCCCCXGGGG.",
                    "..GGGGCCCCCXGGGG.",
                    "...GGCCCCCCXG...",
                    "....CCCCCC......",
                    "....CCRRCC......",
                    "....CCRRCC......",
                    "...CCRRRRCC.....",
                    "...CCRRRRCC.....",
                    "..CCCCRRCCCC....",
                    "..CCCCRRCCCC....",
                    "...CCRRRRCC.....",
                    "...CCRRRRCC.....",
                    "....CCRRCC......"
                ]
            ],
            scorpion: [
                [
                    ".......RR.......",
                    "......RRRR......",
                    ".....RRRRRR.....",
                    "....RRRRRRRR....",
                    "...RRWWWWWWWR...",
                    "..RRWWWWWWWWWR..",
                    ".RRRRRRRRRRRRRR.",
                    "RRRRRRRRRRRRRRRR",
                    "RRRRRRRRRRRRRRRR",
                    ".RRRRRRRRRRRRRR.",
                    "..RRRRRRRRRRRR..",
                    "...RRRRRRRRRR...",
                    "....RRRRRRRR....",
                    ".....RR..RR.....",
                    "......R..R......",
                    "................"
                ],
                [
                    "................",
                    ".......RR.......",
                    "......RRRR......",
                    ".....RRRRRR.....",
                    "....RRRRRRRR....",
                    "...RRWWWWWWWR...",
                    "..RRWWWWWWWWWR..",
                    ".RRRRRRRRRRRRRR.",
                    "RRRRRRRRRRRRRRRR",
                    "RRRRRRRRRRRRRRRR",
                    ".RRRRRRRRRRRRRR.",
                    "..RRRRRRRRRRRR..",
                    "...RRRRRRRRRR...",
                    "....RRRRRRRR....",
                    ".....RR..RR.....",
                    "......R..R......"
                ]
            ]
        };

        let gameActive = false, score = 0, level = 1, lives = 3, frame = 0, highScore = 20000;
        let player = null, enemies = [], bullets = [], enemyBullets = [], stars = [], particles = [];
        let tractorBeam = null, isDualShip = false;

        function initStars() {
            stars = [];
            for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, speed: 0.8 + Math.random() * 2, color: [PALETTE.W, PALETTE.B, PALETTE.R, PALETTE.Y][Math.floor(Math.random() * 4)] });
        }

        function createExplosion(x, y, count = 20) {
            const colors = [PALETTE.W, PALETTE.Y, PALETTE.R, '#FF8800', PALETTE.C];
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 1 + Math.random() * 4.5;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.02,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: 2 + Math.random() * 2
                });
            }
        }

        function drawSprite(data, x, y, rotation = 0, scale = SCALE) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            data.forEach((row, ri) => {
                for (let ci = 0; ci < row.length; ci++) {
                    const char = row[ci];
                    if (char !== '.' && PALETTE[char]) {
                        ctx.fillStyle = PALETTE[char];
                        ctx.fillRect((ci - 8) * scale, (ri - 8) * scale, scale, scale);
                    }
                }
            });
            ctx.restore();
        }

        class Player {
            constructor() {
                this.x = WIDTH / 2;
                this.y = HEIGHT - 40;
                this.cooldown = 0;
                this.exploding = false;
                this.explodeTimer = 0;
                this.invulnerable = 0;
            }
            update() {
                if (this.exploding) {
                    this.explodeTimer--;
                    if (this.explodeTimer <= 0) {
                        this.exploding = false;
                        this.x = WIDTH / 2;
                        this.invulnerable = 90; // ~1.5s invulnerability upon respawn
                    }
                    return;
                }
                if (this.invulnerable > 0) this.invulnerable--;

                if (keys['ArrowLeft'] || touchState.left) this.x -= 2.5;
                if (keys['ArrowRight'] || touchState.right) this.x += 2.5;
                this.x = Math.max(20, Math.min(WIDTH - (isDualShip ? 48 : 20), this.x));
                if ((keys['Space'] || touchState.fire) && this.cooldown <= 0) {
                    bullets.push({ x: this.x, y: this.y - 15 });
                    if (isDualShip) bullets.push({ x: this.x + 28, y: this.y - 15 });
                    playSfx(800); this.cooldown = 18;
                }
                if (this.cooldown > 0) this.cooldown--;
            }
            draw() {
                if (this.exploding) return;
                if (this.invulnerable > 0 && Math.floor(frame / 6) % 2 === 0) return;
                drawSprite(SPRITES.player, this.x, this.y);
                if (isDualShip) drawSprite(SPRITES.player, this.x + 28, this.y);
            }
        }

        class Enemy {
            constructor(tx, ty, type, delay) {
                this.tx = tx; this.ty = ty; this.type = type;
                this.x = WIDTH / 2; this.y = -20;
                this.state = 'wait'; this.timer = delay;
                this.angle = 0; this.phase = 0;
            }
            update() {
                if (this.state === 'wait') { if (this.timer-- <= 0) this.state = 'entry'; return; }
                if (this.state === 'entry') {
                    this.phase += 0.015;
                    this.x = this.tx + Math.cos(this.phase * 8) * (120 * (1 - this.phase));
                    this.y = this.ty + Math.sin(this.phase * 8) * (120 * (1 - this.phase)) - (1 - this.phase) * 100;
                    this.angle = this.phase * 8 + Math.PI / 2;
                    if (this.phase >= 1) { this.state = 'formation'; this.angle = 0; }
                } else if (this.state === 'formation') {
                    this.x = this.tx + Math.sin(frame * 0.04) * 30;
                    this.y = this.ty + Math.cos(frame * 0.02) * 5;
                    if (Math.random() < 0.0004 * level) { this.state = 'dive'; this.phase = 0; }
                } else if (this.state === 'dive') {
                    this.y += 3.5; this.x += Math.sin(this.y * 0.05) * 5;
                    this.angle = Math.PI;
                    if (player && Math.random() < 0.015 && this.y < player.y - 60 && enemyBullets.length < 5) {
                        enemyBullets.push({ x: this.x, y: this.y + 10 });
                        playSfx(350, 'sawtooth', 0.05);
                    }
                    if (this.y > HEIGHT + 20) { this.y = -20; this.state = 'entry'; this.phase = 0; }
                }
            }
            draw() { if (this.state !== 'wait') drawSprite(SPRITES[this.type][Math.floor(frame / 20) % 2], this.x, this.y, this.angle); }
        }

        function handlePlayerHit(isDualHit = false) {
            if (!gameActive || !player || player.exploding || player.invulnerable > 0) return;

            if (isDualShip) {
                isDualShip = false;
                createExplosion(isDualHit ? player.x + 28 : player.x, player.y, 25);
                playSfx(150, 'sawtooth', 0.3);
                if (!isDualHit) {
                    player.x += 28;
                }
                player.invulnerable = 60;
                return;
            }

            player.exploding = true;
            player.explodeTimer = 60;
            createExplosion(player.x, player.y, 35);
            playSfx(120, 'sawtooth', 0.5);
            lives--;
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = Math.max(0, lives);

            if (lives <= 0) {
                player.explodeTimer = 999999;
                setTimeout(() => {
                    gameActive = false;
                    const titleEl = document.getElementById('menu-title');
                    const subEl = document.getElementById('menu-sub');
                    const btnEl = document.getElementById('start-btn');
                    if (titleEl) titleEl.innerText = "GAME OVER";
                    if (subEl) subEl.innerText = `SCORE: ${score}`;
                    if (btnEl) btnEl.innerText = "PLAY AGAIN";
                    document.getElementById('menu-overlay').style.display = 'flex';
                }, 1200);
            }
        }

        function spawnWave() {
            enemies = [];
            const layouts = [
                { type: 'boss', r: 1, c: 4, ox: 130, oy: 60 },
                { type: 'scorpion', r: 1, c: 8, ox: 80, oy: 100 },
                { type: 'butterfly', r: 1, c: 8, ox: 80, oy: 140 },
                { type: 'bee', r: 2, c: 10, ox: 40, oy: 180 }
            ];
            layouts.forEach(l => {
                for (let i = 0; i < l.r; i++) {
                    for (let j = 0; j < l.c; j++) {
                        enemies.push(new Enemy(l.ox + j * 40, l.oy + i * 35, l.type, (i * l.c + j) * 4));
                    }
                }
            });
        }

        function update() {
            if (!gameActive) return;
            frame++;
            if (player) player.update();
            stars.forEach(s => { s.y += s.speed; if (s.y > HEIGHT) s.y = 0; });

            // Player bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= 8;
                let hitEnemy = false;
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < 18) {
                        bullets.splice(i, 1);
                        hitEnemy = true;
                        createExplosion(e.x, e.y, 15);
                        enemies.splice(ei, 1);
                        score += (e.type === 'boss' ? 400 : (e.type === 'scorpion' ? 200 : 100)); 
                        playSfx(100, 'triangle', 0.15);
                        break;
                    }
                }
                if (!hitEnemy && b.y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Enemies update & player collision
            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];
                e.update();
                if (gameActive && player && !player.exploding && player.invulnerable <= 0) {
                    const hitPrimary = Math.hypot(e.x - player.x, e.y - player.y) < 20;
                    const hitDual = isDualShip && Math.hypot(e.x - (player.x + 28), e.y - player.y) < 20;
                    if (hitPrimary || hitDual) {
                        createExplosion(e.x, e.y, 20);
                        playSfx(100, 'triangle', 0.2);
                        enemies.splice(ei, 1);
                        handlePlayerHit(hitDual && !hitPrimary);
                        continue;
                    }
                }
            }

            // Enemy bullets update & player collision
            for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
                const eb = enemyBullets[bi];
                eb.y += 4.5;
                if (eb.y > HEIGHT + 20) {
                    enemyBullets.splice(bi, 1);
                    continue;
                }
                if (gameActive && player && !player.exploding && player.invulnerable <= 0) {
                    const hitPrimary = Math.hypot(eb.x - player.x, eb.y - player.y) < 16;
                    const hitDual = isDualShip && Math.hypot(eb.x - (player.x + 28), eb.y - player.y) < 16;
                    if (hitPrimary || hitDual) {
                        enemyBullets.splice(bi, 1);
                        handlePlayerHit(hitDual && !hitPrimary);
                    }
                }
            }

            // Particles update
            for (let pi = particles.length - 1; pi >= 0; pi--) {
                const p = particles[pi];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(pi, 1);
            }

            if (enemies.length === 0) {
                level++;
                enemyBullets = [];
                spawnWave();
            }

            document.getElementById('score-display').innerText = score.toString().padStart(2, '0');
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').innerText = highScore.toString().padStart(2, '0');
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Stars
            stars.forEach(s => { ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, 2, 2); });

            if (gameActive || player) {
                if (player) player.draw();
                enemies.forEach(e => e.draw());

                // Player bullets
                ctx.fillStyle = PALETTE.C;
                bullets.forEach(b => ctx.fillRect(b.x - 1, b.y - 10, 2, 15));

                // Enemy bullets
                enemyBullets.forEach(b => {
                    ctx.fillStyle = PALETTE.R;
                    ctx.fillRect(b.x - 1.5, b.y - 5, 3, 10);
                    ctx.fillStyle = PALETTE.Y;
                    ctx.fillRect(b.x - 0.5, b.y - 3, 1, 6);
                });

                // Particles
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                });
                ctx.globalAlpha = 1.0;

                // Reserve ships HUD (bottom-left)
                for (let i = 0; i < lives - 1; i++) {
                    drawSprite(SPRITES.player, 20 + i * 20, HEIGHT - 16, 0, 1);
                }
                // Stage badges (bottom-right)
                for (let i = 0; i < Math.min(level, 10); i++) {
                    ctx.fillStyle = PALETTE.B;
                    ctx.fillRect(WIDTH - 20 - i * 14, HEIGHT - 22, 10, 14);
                    ctx.fillStyle = PALETTE.Y;
                    ctx.fillRect(WIDTH - 18 - i * 14, HEIGHT - 20, 6, 4);
                }
            }
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }

        const keys = {};
        window.onkeydown = e => keys[e.code] = true;
        window.onkeyup = e => keys[e.code] = false;

        const touchState = { left: false, right: false, fire: false };
        function bind(id, k) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = e => {
                if (e.preventDefault) e.preventDefault();
                touchState[k] = true;
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            };
            const deactivate = e => {
                if (e.preventDefault) e.preventDefault();
                touchState[k] = false;
            };
            el.ontouchstart = activate;
            el.ontouchend = deactivate;
            el.onmousedown = activate;
            el.onmouseup = deactivate;
            el.onmouseleave = deactivate;
        }
        bind('l-btn', 'left'); bind('r-btn', 'right'); bind('f-btn', 'fire');

        document.getElementById('start-btn').onclick = () => {
            score = 0;
            level = 1;
            lives = 3;
            isDualShip = false;
            bullets = [];
            enemyBullets = [];
            particles = [];
            player = new Player();
            spawnWave();
            gameActive = true;
            document.getElementById('score-display').innerText = '00';
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = '3';
            const titleEl = document.getElementById('menu-title');
            if (titleEl) titleEl.innerText = 'Galaga';
            const subEl = document.getElementById('menu-sub');
            if (subEl) subEl.innerText = 'AUTHENTIC REPLICA';
            const btnEl = document.getElementById('start-btn');
            if (btnEl) btnEl.innerText = 'START GAME';
            document.getElementById('menu-overlay').style.display = 'none';
        };

        window.onload = () => { canvas.width = WIDTH; canvas.height = HEIGHT; initStars(); loop(); };
    </script>
</body>
</html>
