<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080808">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Galaga">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Galaga Arcade - 1981 Namco Edition</title>
    <style>
        :root {
            --arcade-black: #000000;
            --arcade-red: #ff0000;
            --arcade-cyan: #00ffff;
            --arcade-yellow: #ffff00;
            --arcade-pink: #ff00ff;
            --arcade-blue: #2b2bff;
            --arcade-white: #ffffff;
            --arcade-green: #00ff00;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #080808;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            aspect-ratio: 448 / 512;
            width: min(calc(100vw - 16px), calc((100vh - 16px) * (448 / 512)));
            width: min(calc(100dvw - 16px), calc((100dvh - 16px) * (448 / 512)));
            height: auto;
            max-height: calc(100vh - 16px);
            max-height: calc(100dvh - 16px);
            background: var(--arcade-black);
            overflow: hidden;
            border: 3px solid #222;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            outline: 2px solid #000;
        }

        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 25;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute;
            top: 4px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.35fr 1fr;
            padding: 0 12px;
            z-index: 30;
            font-weight: bold;
            font-size: clamp(13px, 2.3vmin, 20px);
            text-align: center;
            pointer-events: none;
            line-height: 1.15;
        }

        .red-text { color: var(--arcade-red); }
        .white-text { color: var(--arcade-white); }

        @keyframes arcadeBlink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.15; }
        }
        .blink-active {
            animation: arcadeBlink 0.55s steps(1, end) infinite;
        }

        .hud-controls {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 2px;
        }

        .hud-chip {
            pointer-events: auto;
            background: rgba(199, 125, 255, 0.16);
            border: 1px solid #c77dff;
            color: #c77dff;
            font-family: inherit;
            font-size: 9px;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 4px;
            cursor: pointer;
        }

        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            text-align: center;
            padding: 16px;
        }

        #results-panel {
            display: none;
            margin-top: 12px;
            padding: 10px 16px;
            border: 1px solid rgba(0, 255, 255, 0.35);
            background: rgba(0, 12, 24, 0.75);
            width: min(86%, 320px);
            font-size: clamp(12px, 2.2vmin, 16px);
            font-weight: bold;
            line-height: 1.6;
        }

        .res-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        #start-btn {
            margin-top: 22px;
            background: none;
            border: 2px solid var(--arcade-cyan);
            color: var(--arcade-cyan);
            padding: 12px 28px;
            font-size: clamp(1.05rem, 2.4vmin, 1.45rem);
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
        }

        /* Ergonomic split thumb controls anchored at bottom-left & bottom-right corners */
        #controls-wrapper {
            position: fixed;
            left: max(18px, var(--safe-left));
            right: max(18px, var(--safe-right));
            bottom: max(18px, var(--safe-bottom));
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 50;
        }

        #dpad-group {
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }

        .t-btn {
            width: 80px;
            height: 80px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.75);
            pointer-events: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: transform 0.06s ease, background-color 0.06s ease, border-color 0.06s ease;
        }

        .t-btn.active,
        .t-btn:active {
            transform: scale(0.93);
            background: rgba(0, 255, 255, 0.2);
            border-color: var(--arcade-cyan);
            color: var(--arcade-white);
        }

        #f-btn {
            width: 88px;
            height: 88px;
            border-color: rgba(255, 0, 0, 0.65);
            color: var(--arcade-red);
            background: rgba(40, 0, 0, 0.55);
        }

        #f-btn.active,
        #f-btn:active {
            background: rgba(255, 0, 0, 0.3);
            border-color: var(--arcade-red);
        }

        @media (pointer: coarse), (hover: none), (max-width: 1024px) {
            #controls-wrapper {
                display: flex;
            }
        }

        @media (max-aspect-ratio: 115/100) and (pointer: coarse),
               (max-aspect-ratio: 115/100) and (max-width: 1024px) {
            #game-wrapper {
                justify-content: flex-start;
                padding-top: 8px;
            }
            #game-container {
                width: min(calc(100vw - 12px), calc((100vh - 122px) * (448 / 512)));
                width: min(calc(100dvw - 12px), calc((100dvh - 122px) * (448 / 512)));
                max-height: calc(100vh - 122px);
                max-height: calc(100dvh - 122px);
            }
        }

        @media (max-width: 500px) {
            #game-container {
                border: none;
                border-radius: 0;
                width: min(100vw, calc((100vh - 108px) * (448 / 512)));
                width: min(100dvw, calc((100dvh - 108px) * (448 / 512)));
                max-height: calc(100vh - 108px);
                max-height: calc(100dvh - 108px);
            }
            .t-btn {
                width: 68px;
                height: 68px;
                font-size: 26px;
            }
            #f-btn {
                width: 74px;
                height: 74px;
            }
            #dpad-group {
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <div id="ui-layer">
                <div><div id="label-1up" class="red-text">1UP</div><div id="score-display" class="white-text">00</div></div>
                <div>
                    <div class="red-text">HIGH SCORE</div>
                    <div id="high-score" class="white-text">20000</div>
                    <div class="hud-controls">
                        <button id="flip-lr-btn" class="hud-chip">⇄ L/R: NORMAL</button>
                        <button id="sound-btn" class="hud-chip" style="border-color:#00ffff; color:#00ffff; background:rgba(0,255,255,0.14);">🔊 SFX</button>
                    </div>
                </div>
                <div><div class="red-text">LIVES</div><div id="lives-display" class="white-text">3</div></div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div id="menu-overlay">
                <h1 id="menu-title" style="color:var(--arcade-red); font-style:italic; font-size:clamp(2.4rem, 7vmin, 3.5rem); margin:0; text-shadow:3px 3px 0 var(--arcade-blue);">GALAGA</h1>
                <p id="menu-sub" style="color:var(--arcade-cyan); letter-spacing:4px; margin:8px 0 0;">1981 NAMCO ARCADE &bull; v8</p>
                <div id="results-panel">
                    <div style="color:var(--arcade-red); margin-bottom:6px; letter-spacing:2px;">-- RESULTS --</div>
                    <div class="res-row" style="color:var(--arcade-yellow);"><span>SHOTS FIRED</span><span id="res-shots">0</span></div>
                    <div class="res-row" style="color:var(--arcade-yellow);"><span>NUMBER OF HITS</span><span id="res-hits">0</span></div>
                    <div class="res-row" style="color:var(--arcade-cyan);"><span>HIT-MISS RATIO</span><span id="res-ratio">0.0%</span></div>
                </div>
                <button id="start-btn">START GAME</button>
                <div style="margin-top:10px; font-size:clamp(0.65rem, 1.5vmin, 0.78rem); color:var(--arcade-yellow); letter-spacing:1.2px; opacity:0.9;">1ST BONUS 20000 PTS &bull; EVERY 70000 PTS</div>
                <div id="gamepad-status" style="margin-top:8px; font-size:clamp(0.66rem, 1.55vmin, 0.8rem); color:#c77dff; letter-spacing:1.5px; opacity:0.85;">🎮 CRKD ATOM / GAMEPAD: PRESS ANY BUTTON</div>
                <button id="install-btn" style="display:none; margin-top:10px; background:none; border:2px solid var(--arcade-yellow); color:var(--arcade-yellow); padding:8px 20px; font-size:0.9rem; font-family:inherit; cursor:pointer;">📲 INSTALL APP</button>
            </div>
        </div>
        <div id="controls-wrapper">
            <div id="dpad-group">
                <div class="t-btn" id="l-btn">←</div>
                <div class="t-btn" id="r-btn">→</div>
            </div>
            <div class="t-btn" id="f-btn">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 448, HEIGHT = 512, SCALE = 2;

        // =========================================================================
        // AUTHENTIC 1981 NAMCO GALAGA WSG (3-VOICE WAVETABLE ROM SOUND ENGINE)
        // Exact 1981 arcade wavetable PROM, frequency table, and 24 sound scripts
        // (0..23) synthesized at 62.5 kHz / 120 Hz tick and cached as AudioBuffers
        // =========================================================================
        let audioCtx = null;
        let soundMuted = false;

        const GalagaSound = (() => {
            function decodeB64(str) {
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
                const clean = str.replace(/[^A-Za-z0-9+/=]/g, '');
                let len = (clean.length * 3) >> 2;
                if (clean.endsWith('==')) len -= 2;
                else if (clean.endsWith('=')) len -= 1;
                const out = new Uint8Array(len);
                let p = 0;
                for (let i = 0; i < clean.length; i += 4) {
                    const a = chars.indexOf(clean[i]);
                    const b = chars.indexOf(clean[i + 1]);
                    const c = clean[i + 2] === '=' ? 0 : chars.indexOf(clean[i + 2]);
                    const d = clean[i + 3] === '=' ? 0 : chars.indexOf(clean[i + 3]);
                    const n = (a << 18) | (b << 12) | (c << 6) | d;
                    if (p < len) out[p++] = (n >> 16) & 0xFF;
                    if (p < len) out[p++] = (n >> 8) & 0xFF;
                    if (p < len) out[p++] = n & 0xFF;
                }
                return out;
            }
            function decodeU16LE(str) {
                const bytes = decodeB64(str);
                const out = new Uint16Array(bytes.length >> 1);
                for (let i = 0; i < out.length; i++) {
                    out[i] = bytes[i * 2] | (bytes[i * 2 + 1] << 8);
                }
                return out;
            }

            const ROM_PROM = decodeB64("cHDgsHBwcKCQkODQoOCAwKCg4ODAwKDAsLDg0NCQwKDAcODA4MDgcNDQ4KDQ4NBw0NDggMCgwIDgcOCAoHDAsODg4IBwwLDQ4HDgoEDwoODQ0ODAINCA0NDQ4NAQgHCgwHDg4ACgUGCwsODQELBgUKCg4LAgcHBQkJDggEAggHBwcABAcICAkFBQACCw0JCQQHAAENCQoIAwMAAg4ECwQCBwADDQUJAQEBAAULBwgAAQcABwcCBgEAAAAHAwAFAwAHAAcBAwQGAAAABQAIBAcBBwADAQUDBwEBAAIDAQIEAgcAAQcDBAIDAwACDgYGAgQHAAQHAwgEBQUABwABCQcA==");
            const ROM_FREQ = decodeU16LE("UIEAiSaRyJnsop2s4LbAwUXNetlp5hz0AAA=");
            const ROM_META = decodeB64("AAEAAQEBAgEBAwEBBAEBBQEABgECIAMACgMADQMABwMAEwMAFgMAGQMAHAMAHwECLAMAEAMAIwEAJAEAJQMAKAEAKQMA");
            const ROM_WOFF = decodeU16LE("AABXADUAAQChALsAzwAVAiUCNQLfAfEBAwJFAokCzQL5Aj0DgQPjAC8BeQGfBC0FewWpAbsBzQHjAOMA4wBLBK0D4wMZBDcESwSvBSMGnwahBSMFcQWXBeEGHQdZBw==");
            const ROM_MASK = decodeB64("BAICAgIEBAoHDAsECg0EAQQMAgYFAgM=");
            const ROM_WROM = decodeB64("/wAABnEBcgFzAXUBdAFzAXIBcQFwAYsBigEMBIYBhwGIAYkBigGJAYgBhwGGAYUBhAGDAf8AAASIAYoBcAFxAXMBdQF3AXgBDAZ0AXMBcgFxAXABiwH/AAAHiQGKAYsBDAFwAXEBcgEMAXMBdAF1AQwDiwFwAXEBDAFyAXMBdAEMAXUBdgF3AQwDcQFyAXMBDAF0AXUBdgEMAXcBeAF5Af8AAAVxAXIBcwEMAXQBdQF2AQwBdwF4AXkB/wAABGEBegFgAXgBegF2AXgBdQH/AAAAdgF5AWABYwFmAWMBYAF5Af8AAAeBCIEBhgOICYsDigmGA4gJcwNxCYYDiAmLA4oJhgNxCXUDdgl0A3IJcQOLCYkDiAmEA3QJdgN0CXEDcwSLBIgEcQSKBIgEDBD/AAAGigmBA4gJgwOGCYEDgwmFA4oJgQOICYMDhgmBA4gJcQNyCXEDiwmJA4gJhgOECYgDiQmLA4kJhgOLBIgEgwSIBIUEgwQMEP8AAAeBDIMJhgOFDIEMhgyICYsDigyIDIkMiAmGA4QMiQx0DHEJiQOIDHEJigMMEP8CAAN4AgwBeAF5AXsBYQMMA/8CAANzAgwBcwF0AXYBeAMMAv8CAANwAgwBcAFxAXMBdQMMA/8BAAR4AXoBYwF4AXoBYwFlA/8BAAVzAXgBegFzAXgBegFgA/8BAAeKAXMBeAGKAXMBeAF6A/8BBgR6AXgBegFhAWUBaAP/AQYEeAF1AXgBegFhAWUD/wEGBHUBcQF1AXgBegFgA/8CBAN6AXYBeAF1AXYBcwF1AXIBcwGKAYsBiAGGAYUBgwGCAYMBhgGFAYgBhgGKAYgBiwGKAXMBcgFzAXUBigFwAXIB/wIEA3YBcwF1AXIBcwFwAXIBigGLAYYBiAGFAYMBggGAAZoBmgGDAYIBhQGDAYYBhQGIAYYBigGIAYsBigGIAYYBhQH/AhADkwKaAoMDmgGYAZYBlQGTApUDlgKYApoCmwKaApgBlgGVAZIBkwGVAf8CBAN6AXcBeAF1AXcBcwF1AXIBcwGKAYABiAGHAYUBgwGCAYMBhwGFAYgBhwGKAYgBgAGKAXMBcgFzAXUBigFwAXIB/wIEA3cBcwF1AXIBcwFwAXIBigGAAYcBiAGFAYMBggGAAZoBmgGDAYIBhQGDAYcBhQGIAYcBigGIAYABigGIAYcBhQH/AhADkwKaAoMDmgGYAZcBlQGTApUDlwKYApoCkAKaApgBlwGVAZIBkwGVAf8CBAN6AXYBeAF1AXYBcwF1AXIBcwGKAYoBiAGGAYUBgwGCAYMBhQGGAYgBhgGKAXABcgFzBP8CBAN2AXMBdQFyAXMBcAFyAYoBigGGAYYBhQGDAYIBgAGaAZoBiwGAAYIBgwGFAYYBiAGKBP8CEANzAnUCdgJ1AnMCcgJwAnICcwKLAooChgKDBP8AAARxBHMEcQRzBHYEeAR2BHgE/wAABlYBVQFUAVMBUgFRAVABawFqAWkBaAFnAWYBZQFkAWMBYgFhAWABewF6AXkBeAF3AXYBdQF0AXMBcgFxAXABiwGKAYkBiAGHAYYBhQGEAYMB/wIEBWABeAF1AXEBYAF4AXUBcQFgAXgBdQFxAWABeAF1AXEBYAF4AXUBcQFgAXgBdQFxAWABDAF4AXoBdQF4AXMBdQFhAXoBdgFzAWEBegF2AXMBYQF6AXYBcwFhAXoBdgFzAWEBeQF2AXMBYQF5AXYBcwFhAQwBeQFhAXgBeQF1AXgB/wICBWABYAFgAf8CBAVhAngCeAJhAngCeAJhAngCeAJhAngCeAJhAngCegJ1AmMCegJ6AmMCegJ6AmMCegJ5AmMCeQJ5AmMCeQJ2AnMC/wICBXgBeAF4Af8CEAWFBoUGhQaFBoUEhQSGBoYGhgaGBoYEhgT/AgQFgQGBAYEB/wIAB2UBDAFhAQwBYwH/AgAFegUMAXoBDAF6AwwB             const PROM4 = new Uint8Array(256);
            for (let i = 0; i < 256; i++) PROM4[i] = (ROM_PROM[i] >> 4) & 0x0F;

            const S00_STEP_UP = [0x0130, 0x0168, 0x0136, 0x01A8, 0x0168, 0x0200, 0x01AC, 0x0208];
            const S00_STEP_DN = [0xFE00, 0xFE58, 0xFE08, 0xFE98, 0xFE58, 0xFED0, 0xFE98, 0xFED6];
            const S00_BASE_UP = [0x5B00, 0x6C00, 0x5B00, 0x7E00, 0x6C00, 0x9700, 0x8100, 0x9900];
            const S00_BASE_DN = [0xD900, 0xB600, 0xD900, 0x9700, 0xB600, 0x7E00, 0x9900, 0x8100];
            const S23_GAIN = [255,254,252,251,249,247,246,244,242,241,239,238,236,234,233,231,229,228,226,224,223,221,220,218,216,215,213,211,210,208,207,205,203,202,200,198,197,195,193,192,190,189,187,185,184,182,180,179,177,176,174,172,171,169,167,166,164,162,161,159,158,156,154,153,151,149,148,146,145,143,141,140,138,136,135,133,131,130,128,127,125,123,122,120,118,117,115,114,112,110,109,107,105,104,102,100,99,97,96,94,92,91,89,87,86,84,83,81,79,78,76,74,73,71,69,68,66,65,63,61,60,58,56,55,53,51,50,48,46,44,43,41,39,37,36,34,32,30,29,27,25,23,22,20,18,16,15,13,11,9,8,6,4,2];

            // Render any authentic 1981 Galaga sound (0..23) through the exact 62.5 kHz WSG engine
            function renderPCM(sid, outRate = 44100) {
                const states = new Uint8Array(47);
                const positions = new Uint8Array(47);
                const acc16 = new Uint16Array(3);
                const inc16 = new Uint16Array(3);
                const volRaw = new Uint8Array(3);
                const waveSel = new Uint8Array(3);
                const in_sound = new Uint8Array(24);
                let s05_cnt = 0, s05_vol = 0x0C, s06_cnt = 0, s06_ws = 0;
                let s10_fading = false, s10_fadeVol1 = 0;
                let s00_dir = 1, s00_seg = 0, s00_tick = 0, s00_acc = 0, s00_step = 0, s00_cycles = 0;
                let s23_tick = 0, s23_env = 0, s23_lfsr = 0xACE1, s23_wh = 0, s23_nd = 0, s23_bx = 0, s23_lpy = 0;

                function s00_load() {
                    const i = s00_seg & 7;
                    if (s00_dir === 1) {
                        s00_step = S00_STEP_UP[i];
                        s00_acc = (S00_BASE_UP[i] + s00_step) & 0xFFFF;
                    } else {
                        s00_step = S00_STEP_DN[i];
                        s00_acc = (S00_BASE_DN[i] + s00_step) & 0xFFFF;
                    }
                }
                function getMeta(s) {
                    let baseOffset = ROM_META[s * 3];
                    let numVoices = ROM_META[s * 3 + 1];
                    let voiceStart = ROM_META[s * 3 + 2];
                    if (s === 0x0E) {
                        if (positions[0x1C] === 0) numVoices = 1;
                        else if (positions[0x1C] === 1) numVoices = 2;
                        else numVoices = (positions[0x1D] !== 0) ? 2 : 3;
                    }
                    return { baseOffset, numVoices, voiceStart };
                }
                function initSnd(off, nv) {
                    for (let i = 0; i < nv; i++) {

                    const wb = ROM_WOFF[off];
                    const data0 = ROM_WROM[wb], data1 = ROM_WROM[wb + 1], ws = ROM_WROM[wb + 2];
                    const pos = positions[off];
                    const db = ROM_WROM[wb + 3 + pos];
                    const dn = ROM_WROM[wb + 3 + pos + 1];
                    if (db === 0xFF) {
                        volRaw[voice] = 0; inc16[voice] = 0; acc16[voice] = 0;
                        return true;
                    }
                    let bf = ROM_FREQ[db & 0x0F] >>> ((db >> 4) & 0x0F);

                    if (inc > 0xFFFF) inc = 0xFFFF;

                    } else {

                        if (m0 !== 0) {
                            const st = states[off];
                            if (m0 === 1) { if (st < 6) v = (st + st) & 0xFF; else fall = true; }
                            else { if (st < 6) v = (~st) & 0xFF; else fall = true; }
                        } else {
                            fall = true;
                        }
                        if (fall) {
                            const m1 = data1 & w;
                            if (m1 !== 0) {
                                const st = states[off];
                                if (st <= 0x0A) v = 0x0A;
                                else if (st >= 0x15) v = 0;
                                else v = (0x15 - st) & 0xFF;
                            } else {
                                v = 0x0A;
                            }
                        }
                    }
                    if (s === 10 && voice === 1 && s10_fading) {
                        if (s10_fadeVol1 > 0) s10_fadeVol1--;
                        v = s10_fadeVol1 & 0x0F;
                    }
                    if (s === 10) v = v > 5 ? v - 5 : 0;
                    volRaw[voice] = v;
                    waveSel[voice] = ws & 7;
                    if ((v & 0x0F) === 0) { inc16[voice] = 0; acc16[voice] = 0; }
                    let m = ROM_MASK[s], d = dn, acc = 0;
                    for (let i = 0; i < 8; i++) {
                        if (m & 1) acc = (acc + d) & 0xFF;
                        d = (d << 1) & 0xFF;
                        m >>= 1;
                    }
                    if (states[off] === acc) {
                        states[off] = 0;
                        positions[off] = (positions[off] + 2) & 0xFF;
                    }
                    return false;
                }

                const chunks = [];
                let finished = false, ticks = 0, bisLoops = 0;
                const maxTicks = 960; // 8s safety ceiling
                const stepRatio = 62500 / outRate;
                let phaseFrac = 0;
                let lpState = 0;
                const lpAlpha = 0.34; // Namco RC output filter (~3.4 kHz @ 62.5 kHz)

                if (sid === 23) { s23_env = 255; }
                else if (sid === 0) { s00_load(); }

                while (!finished && ticks < maxTicks) {

                        if (s00_tick !== 0) s00_acc = (s00_acc + s00_step) & 0xFFFF;
                        const H = (s00_acc >> 8) & 0xFF;
                        waveSel[0] = 0; volRaw[0] = 0x0A; inc16[0] = ((H << 8) >> 7) & 0xFFFF;
                        s00_tick++;

                            s00_tick = 0; s00_seg++;
                            if (s00_seg >= 8) {
                                s00_seg = 0;
                                s00_dir = s00_dir === 1 ? 0xFF : 1;
                                s00_cycles++;
                                if (s00_cycles >= 2) finished = true;
                            }
                            s00_load();
                        }
                    } else if (sid === 23) {
                        if (s23_tick < S23_GAIN.length) s23_env = S23_GAIN[s23_tick++];
                        else { s23_env = 0; finished = true; }
                    } else {
                        if (in_sound[sid] === 0) {
                            in_sound[sid] = 1;
                            if (sid === 0x0E) { positions[0x1C] = positions[0x1D] = 0; states[0x1C] = states[0x1D] = 0; }
                            const m = getMeta(sid);
                            initSnd(m.baseOffset, m.numVoices);
                        }
                        const m = getMeta(sid);
                        let done = false;
                        for (let i = 0; i < m.numVoices; i++) {
                            if (m.voiceStart + i < 3) done = processChunk(m.baseOffset + i, m.voiceStart + i, sid) || done;
                        }
                        if (sid === 0x0E) {
                            const used = [false, false, false];
                            for (let i = 0; i < m.numVoices; i++) if (m.voiceStart + i < 3) used[m.voiceStart + i] = true;
                            volRaw[2] = used[2] ? 9 : 0; volRaw[1] = used[1] ? 6 : 0;
                            for (let v = 0; v < 3; v++) if (!used[v]) { volRaw[v] = 0; inc16[v] = 0; }
                        }
                        if (sid === 0x05) {
                            s05_cnt++;
                            if (s05_cnt > 6) { s05_cnt = 0; s05_vol = s05_vol < 4 ? 0x0C : s05_vol - 1; }
                            volRaw[2] = s05_vol;
                        }

                            s06_cnt++;
                            if (s06_cnt === 0x1C) { s06_cnt = 0; s06_ws = (s06_ws + 1) & 7; }

                        }

                            const env = Math.min(volRaw[0] & 0x0F, volRaw[2] & 0x0F);
                            if ((volRaw[1] & 0x0F) > env) volRaw[1] = env;
                            if (!s10_fading && (volRaw[0] & 0x0F) === 0 && (volRaw[2] & 0x0F) === 0) {
                                s10_fading = true; s10_fadeVol1 = volRaw[1] & 0x0F;
                            }
                        }

                            in_sound[sid] = 0;
                            if (sid === 5 || sid === 6) {
                                bisLoops++;

                            } else {

                            }

                    for (let s = 0; s < 521; s++) {

                        if (sid === 23) {
                            if (++s23_nd >= 16) {
                                s23_nd = 0;
                                const lsb = s23_lfsr & 1; s23_lfsr >>>= 1; if (lsb) s23_lfsr ^= 0xB400;
                                s23_wh = (s23_lfsr & 0x80) ? ((s23_lfsr & 0xFF) - 256) : (s23_lfsr & 0xFF);
                            }
                            s23_bx = s23_bx + s23_wh - (s23_bx >> 4);
                            s23_lpy += (s23_bx - s23_lpy) >> 5;
                            const y8 = s23_lpy > 127 ? 127 : (s23_lpy < -128 ? -128 : s23_lpy);
                            mix = (((y8 * s23_env) >> 8) * 175) >> 6;
                        } else {
                            for (let v = 0; v < 3; v++) {
                                const vl = volRaw[v] & 0x0F;
                                if (!vl) continue;
                                acc16[v] = (acc16[v] + inc16[v]) & 0xFFFF;
                                const idx = ((acc16[v] >> 8) & 0xF8) | waveSel[v];
                                mix += (PROM4[idx] - 8) * vl;
                            }
                        }
                        if (mix > 192) mix = 192;
                        else if (mix < -192) mix = -192;
                        // 6-bit DAC quantization + Namco RC low-pass filter
                        const q = Math.round(((mix + 192) * 63) / 384) / 31.5 - 1.0;
                        lpState += (q - lpState) * lpAlpha;
                        phaseFrac += 1;
                        if (phaseFrac >= stepRatio) {
                            phaseFrac -= stepRatio;
                            chunks.push(lpState);
                        }
                    }
                }
                return new Float32Array(chunks);

            const bufferCache = new Array(24).fill(null);

            let musicUntil = 0;
            let ambienceSource = null;
            let ambienceGain = null;
            let beamSource = null;
            let beamMode = 0; // 0=off, 5=tractor, 6=capture

            function ensureCtx() {
                try {
                    if (!audioCtx && typeof window !== 'undefined') {
                        const AC = window.AudioContext || window.webkitAudioContext;
                        if (AC) audioCtx = new AC();
                    }
                    if (!audioCtx) return null;
                    if (audioCtx.state === 'suspended' && audioCtx.resume) audioCtx.resume();
                    return audioCtx;
                } catch (e) {
                    return null;
                }
            }

            function getBuffer(c, sid) {
                if (bufferCache[sid]) return bufferCache[sid];
                if (!c || !c.createBuffer) return null;
                const sr = c.sampleRate || 44100;
                const pcm = renderPCM(sid, sr);
                const buf = c.createBuffer(1, Math.max(1, pcm.length), sr);
                const ch = buf.getChannelData(0);
                ch.set(pcm);
                bufferCache[sid] = buf;
                return buf;
            }

            function stopMusic() {
                if (musicSource) {
                    try { musicSource.stop(); } catch (e) {}
                    musicSource = null;
                }
                musicUntil = 0;
            }

            function stopAmbience() {
                if (ambienceSource) {
                    try { ambienceSource.stop(); } catch (e) {}
                    ambienceSource = null;
                    ambienceGain = null;
                }
            }

            function stopBeam() {
                if (beamSource) {
                    try { beamSource.stop(); } catch (e) {}
                    beamSource = null;
                }
                beamMode = 0;
            }

            function stopAll() {
                stopMusic();
                stopAmbience();
                stopBeam();
            }

            function playOneShot(sid, vol = 0.42, isMusic = false, playbackRate = 1.0) {
                if (soundMuted) return;
                const c = ensureCtx();
                if (!c) return;
                try {
                    if (!c.createBuffer || !c.createBufferSource) {
                        // Minimal fallback for stripped headless unit-test AudioContext mocks
                        if (c.createOscillator && c.createGain) {
                            const osc = c.createOscillator();
                            const gain = c.createGain();
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(440, c.currentTime);
                            gain.gain.setValueAtTime(0.05, c.currentTime);
                            osc.connect(gain); gain.connect(c.destination);
                            osc.start(); osc.stop(c.currentTime + 0.05);
                        }
                        return;
                    }
                    const buf = getBuffer(c, sid);
                    if (!buf) return;
                    if (isMusic) {
                        stopMusic();
                        stopAmbience();
                    }
                    const src = c.createBufferSource();
                    src.buffer = buf;
                    if (playbackRate !== 1.0 && src.playbackRate) src.playbackRate.value = playbackRate;
                    const gain = c.createGain();
                    gain.gain.setValueAtTime(vol, c.currentTime);
                    src.connect(gain);
                    gain.connect(c.destination);
                    src.start(c.currentTime);
                    if (isMusic) {
                        musicSource = src;
                        musicUntil = c.currentTime + (buf.duration / playbackRate);
                        src.onended = () => { if (musicSource === src) { musicSource = null; musicUntil = 0; } };
                    }
                } catch (e) {}
            }

            function syncLoops(wantAmbience, fastAmbience, wantBeamMode) {
                if (soundMuted) {

                    if (wantBeamMode === 5 || wantBeamMode === 6) {

                            const buf = getBuffer(c, wantBeamMode);
                            if (buf) {

                                src.buffer = buf;
                                src.loop = true;
                                const gain = c.createGain();
                                gain.gain.setValueAtTime(0.36, c.currentTime);
                                src.connect(gain);
                                gain.connect(c.destination);

                            src.buffer = buf;
                            src.loop = true;

                            gain.gain.setValueAtTime(0.24, c.currentTime);

                            gain.connect(c.destination);

                            ambienceGain = gain;
                        }

            }

            return lvl >= 3 && (lvl - 3) % 4 === 0;

        function getTransformTypeForLevel(lvl) {
            if (lvl < 4 || isChallengingLevel(lvl)) return null;
            // Stages 4-6 -> scorpion (1000), 8-10 -> bosconian (2000), 12-14 -> galaxian (3000), repeating
            const blockIndex = Math.floor((lvl - 4) / 4) % 3;
            if (blockIndex === 0) return { type: 'scorpion', bonus: 1000 };
            if (blockIndex === 1) return { type: 'bosconian', bonus: 2000 };
            return { type: 'galaxian', bonus: 3000 };
        }

        function drawSprite(data, x, y, rotation = 0, scale = SCALE) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            const half = data.length / 2;
            data.forEach((row, ri) => {
                for (let ci = 0; ci < row.length; ci++) {
                    const char = row[ci];
                    if (char !== '.' && PALETTE[char]) {
                        ctx.fillStyle = PALETTE[char];
                        ctx.fillRect((ci - half) * scale, (ri - half) * scale, scale, scale);
                    }
                }
            });
            ctx.restore();
        }

        // =========================================================================
        // CHOREOGRAPHED SPLINE PATH EVALUATOR (ENTRY WAVES & CHALLENGING STAGES)
        // =========================================================================
        function evalPolylinePath(pts, t) {
            const clamped = Math.max(0, Math.min(0.9999, t));
            const totalSegs = pts.length - 1;
            const scaled = clamped * totalSegs;
            const seg = Math.min(totalSegs - 1, Math.floor(scaled));
            const u = scaled - seg;
            // Catmull-Rom smooth spline interpolation through control points
            const p0 = pts[Math.max(0, seg - 1)];
            const p1 = pts[seg];
            const p2 = pts[Math.min(totalSegs, seg + 1)];
            const p3 = pts[Math.min(totalSegs, seg + 2)];
            const u2 = u * u, u3 = u2 * u;
            const x = 0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u3);
            const y = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3);
            const dx = 0.5 * ((-p0[0] + p2[0]) + 2 * (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u + 3 * (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * u2);
            const dy = 0.5 * ((-p0[1] + p2[1]) + 2 * (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u + 3 * (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u2);
            return { x, y, angle: Math.atan2(dy, dx) + Math.PI / 2 };
        }

        function getFormationSlotPos(tx, ty) {
            if (!formationEntered) {
                return {
                    x: tx + Math.sin(formationClock * 0.022) * 22,
                    y: ty + Math.cos(formationClock * 0.014) * 2.5
                };
            }
            // Authentic 1981 Galaga breathing expansion/contraction around screen center
            const pulse = 1 + Math.sin(formationBreath * 0.048) * 0.115;
            const sway = Math.sin(formationClock * 0.015) * 8;
            return {
                x: (WIDTH / 2) + (tx - WIDTH / 2) * pulse + sway,
                y: 72 + (ty - 72) * (1 + Math.sin(formationBreath * 0.048) * 0.06)
            };
        }

        function fireAimedEnemyBullet(x, y) {
            const maxEnemyBullets = Math.min(3 + Math.floor(level / 2), 8);
            if (!player || enemyBullets.length >= maxEnemyBullets) return;
            const speed = Math.min(3.3 + (level - 1) * 0.16, 4.9);
            const targetX = isDualShip ? player.x + 14 : player.x;
            const dx = targetX - x;
            const dy = Math.max(40, player.y - y);
            const dist = Math.hypot(dx, dy);
            // Clamp horizontal deflection to realistic Galaga aimed-shot cone
            let vx = (dx / dist) * speed;
            const maxVx = speed * 0.52;
            vx = Math.max(-maxVx, Math.min(maxVx, vx));
            const vy = Math.sqrt(Math.max(1, speed * speed - vx * vx));
            enemyBullets.push({ x, y: y + 10, vx, vy });
        }

        // =========================================================================
        // PLAYER CLASS (AUTHENTIC 2-SHOT LIMIT & DUAL FIGHTER MECHANICS)
        // =========================================================================
        class Player {
            constructor() {
                this.x = WIDTH / 2;
                this.y = HEIGHT - 42;
                this.cooldown = 0;
                this.exploding = false;
                this.explodeTimer = 0;
                this.invulnerable = 0;
                this.capturing = false;
                this.captured = false;
                this.captureAngle = 0;
            }
            update() {
                if (this.captured) return;
                if (this.capturing) {
                    this.captureAngle += 0.28;
                    return;
                }
                if (this.exploding) {
                    this.explodeTimer--;
                    if (this.explodeTimer <= 0) {
                        this.exploding = false;
                        this.x = WIDTH / 2;
                        this.y = HEIGHT - 42;
                        this.invulnerable = 90;
                    }
                    return;
                }
                if (this.invulnerable > 0) this.invulnerable--;

                const keyLeft = controllerInvertX ? (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6'])
                                                  : (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4']);
                const keyRight = controllerInvertX ? (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4'])
                                                   : (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6']);
                const moveLeft = keyLeft || touchState.left || gamepadState.left;
                const moveRight = keyRight || touchState.right || gamepadState.right;
                const firePressed = keys['Space'] || keys['Enter'] || keys['NumpadEnter'] || keys['KeyZ'] || keys['KeyX'] || keys['KeyK'] ||
                                    keys['ControlLeft'] || keys['ControlRight'] || keys['ShiftLeft'] || keys['ShiftRight'] ||
                                    touchState.fire || gamepadState.fire;

                if (moveLeft) this.x -= 3.0;
                if (moveRight) this.x += 3.0;
                this.x = Math.max(20, Math.min(WIDTH - (isDualShip ? 48 : 20), this.x));

                // Authentic 1981 Galaga 2-shot cap per fighter (2 active bullets single, 4 dual)
                const maxActiveBullets = isDualShip ? 4 : 2;
                const shotBatch = isDualShip ? 2 : 1;
                if (firePressed && this.cooldown <= 0 && (bullets.length + shotBatch) <= maxActiveBullets) {
                    bullets.push({ x: this.x, y: this.y - 16 });
                    shotsFired++;
                    if (isDualShip) {
                        bullets.push({ x: this.x + 28, y: this.y - 16 });
                        shotsFired++;
                    }
                    GalagaSound.playShot();
                    this.cooldown = 7;
                }
                if (this.cooldown > 0) this.cooldown--;
            }
            draw() {
                if (this.exploding || this.captured) return;
                if (!this.capturing && this.invulnerable > 0 && Math.floor(frame / 6) % 2 === 0) return;
                drawSprite(this.capturing && Math.floor(frame / 8) % 2 === 1 ? SPRITES.captured_player : SPRITES.player, this.x, this.y, this.capturing ? this.captureAngle : 0);
                if (isDualShip && !this.capturing) drawSprite(SPRITES.player, this.x + 28, this.y);
            }
        }
