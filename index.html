<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Galaga Arcade - Pixel Perfect Edition</title>
    <style>
        :root {
            --arcade-black: #000000;
            --arcade-red: #ff0000;
            --arcade-cyan: #00ffff;
            --arcade-yellow: #ffff00;
            --arcade-pink: #ff00ff;
            --arcade-blue: #2b2bff;
            --arcade-white: #ffffff;
            --arcade-green: #00ff00;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #080808;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #game-container {
            position: relative;
            aspect-ratio: 448 / 512;
            /* Dynamically scale 7:8 arcade playfield to fit viewport without clipping */
            width: min(calc(100vw - 16px), calc((100vh - 16px) * (448 / 512)));
            width: min(calc(100dvw - 16px), calc((100dvh - 16px) * (448 / 512)));
            height: auto;
            max-height: calc(100vh - 16px);
            max-height: calc(100dvh - 16px);
            background: var(--arcade-black);
            overflow: hidden;
            border: 3px solid #222;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.95);
            outline: 2px solid #000;
        }

        #game-container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 25;
            background-size: 100% 2px, 2px 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        #ui-layer {
            position: absolute;
            top: 6px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 0 15px;
            z-index: 30;
            font-weight: bold;
            font-size: clamp(14px, 2.5vmin, 22px);
            text-align: center;
            pointer-events: none;
        }

        .red-text { color: var(--arcade-red); }
        .white-text { color: var(--arcade-white); }
        
        #menu-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 40;
            text-align: center;
        }

        #start-btn {
            margin-top: 30px;
            background: none;
            border: 2px solid var(--arcade-cyan);
            color: var(--arcade-cyan);
            padding: 12px 28px;
            font-size: clamp(1.1rem, 2.5vmin, 1.5rem);
            font-family: inherit;
            cursor: pointer;
        }

        /* Ergonomic split thumb controls anchored at bottom-left & bottom-right corners */
        #controls-wrapper {
            position: fixed;
            left: max(18px, var(--safe-left));
            right: max(18px, var(--safe-right));
            bottom: max(18px, var(--safe-bottom));
            display: none;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: none;
            z-index: 50;
        }

        #dpad-group {
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }

        .t-btn {
            width: 80px;
            height: 80px;
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.22);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: rgba(255, 255, 255, 0.75);
            pointer-events: auto;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            transition: transform 0.06s ease, background-color 0.06s ease, border-color 0.06s ease;
        }

        .t-btn.active,
        .t-btn:active {
            transform: scale(0.93);
            background: rgba(0, 255, 255, 0.2);
            border-color: var(--arcade-cyan);
            color: var(--arcade-white);
        }

        #f-btn {
            width: 88px;
            height: 88px;
            border-color: rgba(255, 0, 0, 0.65);
            color: var(--arcade-red);
            background: rgba(40, 0, 0, 0.55);
        }

        #f-btn.active,
        #f-btn:active {
            background: rgba(255, 0, 0, 0.3);
            border-color: var(--arcade-red);
        }

        /* Show touch controls on touch screens (including Z Fold 8 unfolded & folded) */
        @media (pointer: coarse), (hover: none), (max-width: 1024px) {
            #controls-wrapper {
                display: flex;
            }
        }

        /*
         * When in portrait / squarish unfolded orientation (aspect ratio < 1.15, e.g. Z Fold 8
         * unfolded portrait ~3:4 or cover screen), reserve vertical space at the bottom so the
         * corner thumb controls never obscure the player ship or bottom HUD.
         */
        @media (max-aspect-ratio: 115/100) and (pointer: coarse),
               (max-aspect-ratio: 115/100) and (max-width: 1024px) {
            #game-wrapper {
                justify-content: flex-start;
                padding-top: 8px;
            }
            #game-container {
                width: min(calc(100vw - 12px), calc((100vh - 122px) * (448 / 512)));
                width: min(calc(100dvw - 12px), calc((100dvh - 122px) * (448 / 512)));
                max-height: calc(100vh - 122px);
                max-height: calc(100dvh - 122px);
            }
        }

        /* Compact button sizing for narrow cover display when folded */
        @media (max-width: 500px) {
            #game-container {
                border: none;
                border-radius: 0;
                width: min(100vw, calc((100vh - 108px) * (448 / 512)));
                width: min(100dvw, calc((100dvh - 108px) * (448 / 512)));
                max-height: calc(100vh - 108px);
                max-height: calc(100dvh - 108px);
            }
            .t-btn {
                width: 68px;
                height: 68px;
                font-size: 26px;
            }
            #f-btn {
                width: 74px;
                height: 74px;
            }
            #dpad-group {
                gap: 12px;
            }
        }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="game-container">
            <div id="ui-layer">
                <div><div class="red-text">1UP</div><div id="score-display" class="white-text">00</div></div>
                <div>
                    <div class="red-text">HIGH SCORE</div>
                    <div id="high-score" class="white-text">20000</div>
                    <button id="flip-lr-btn" style="pointer-events:auto; margin-top:2px; background:rgba(199,125,255,0.18); border:1px solid #c77dff; color:#c77dff; font-family:inherit; font-size:10px; font-weight:bold; padding:2px 6px; border-radius:4px; cursor:pointer;">⇄ L/R: NORMAL</button>
                </div>
                <div><div class="red-text">LIVES</div><div id="lives-display" class="white-text">3</div></div>
            </div>
            <canvas id="gameCanvas"></canvas>
            <div id="menu-overlay">
                <h1 id="menu-title" style="color:var(--arcade-red); font-style:italic; font-size:3.5rem; margin:0; text-shadow:3px 3px 0 var(--arcade-blue);">Galaga</h1>
                <p id="menu-sub" style="color:var(--arcade-cyan); letter-spacing:5px;">AUTHENTIC REPLICA</p>
                <button id="start-btn">START GAME</button>
                <div id="gamepad-status" style="margin-top:12px; font-size:clamp(0.68rem, 1.6vmin, 0.82rem); color:#c77dff; letter-spacing:1.5px; opacity:0.85;">🎮 CRKD ATOM / GAMEPAD: PRESS ANY BUTTON</div>
            </div>
        </div>
        <div id="controls-wrapper">
            <div id="dpad-group">
                <div class="t-btn" id="l-btn">←</div>
                <div class="t-btn" id="r-btn">→</div>
            </div>
            <div class="t-btn" id="f-btn">🔥</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const WIDTH = 448, HEIGHT = 512, SCALE = 2;

        let audioCtx = null;
        function playSfx(freq, type = 'square', duration = 0.1) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        const PALETTE = {
            'W': '#DEDEDE',
            'R': '#FF0000',
            'B': '#0068DE',
            'V': '#0000DE',
            'Y': '#FFFF00',
            'T': '#009797',
            'O': '#DE4700',
            'P': '#9700DE',
            'M': '#FF00DE',
            'C': '#00FFFF',
            'G': '#00FF00',
            'D': '#555555',
            '.': 'transparent'
        };
        const SPRITES = {
            player: [
                ".......W........",
                ".......W........",
                ".......W........",
                "......WWW.......",
                "......WWW.......",
                "...R..WWW..R....",
                "...R..WWW..R....",
                "...W.WWWWW.W....",
                "R..WBWWRWWBW..R.",
                "R..BWWRRRWWB..R.",
                "W..WWWRWRWWW..W.",
                "W.WWWWWWWWWWW.W.",
                "WWWWWRWWWRWWWWW.",
                "WWW.RRWWWRR.WWW.",
                "WW..RR.W.RR..WW.",
                "W......W......W."
            ],
            bee: [
                [
                    "................",
                    "................",
                    "..B....Y....B...",
                    "..B..YRYRY..B...",
                    "...B.RRYRR.B....",
                    ".....YYYYY......",
                    "...BBYYYYYBB....",
                    "..BBBRRRRRBBB...",
                    "..BBB.RRR.BBB...",
                    ".BBBB.YYY.BBBB..",
                    "..BBB..RRR..BBB.",
                    "..BBB...R...BBB.",
                    "................",
                    "................",
                    "................",
                    "................"
                ],
                [
                    "................",
                    "................",
                    "...B...Y...B....",
                    "...B.YRYRY.B....",
                    "....BRRYRRB.....",
                    ".....YYYYY......",
                    "....BBYYYBB.....",
                    "....BBRRRBB.....",
                    "...BB.RRR.BB....",
                    "...BB.YYY.BB....",
                    "...BB.RRR.BB....",
                    "...BB..R..BB....",
                    "................",
                    "................",
                    "................",
                    "................"
                ]
            ],
            butterfly: [
                [
                    "................",
                    "................",
                    "................",
                    "...R..B.B..R....",
                    ".RRR..B.B..RRR..",
                    ".RRR.WRWRW.RRR..",
                    ".RRR.WWWWW.RRR..",
                    "..RRRRWWWRRRR...",
                    "...RRRBBBRRR....",
                    "..RRRRBBBRRRR...",
                    ".RRRRRWWWRRRRR..",
                    "..RRR.BBB.RRR...",
                    "....R.....R.....",
                    "................",
                    "................",
                    "................"
                ],
                [
                    "................",
                    "................",
                    "................",
                    "....R.......R...",
                    "....R..B.B..R...",
                    "....R.WRWRW.R...",
                    "....R.WWWWW.R...",
                    "....RRRWWWRRR...",
                    "......RBBBR.....",
                    "....RRRBBBRRR...",
                    "....RRRWWWRRR...",
                    "....RR.BBB.RR...",
                    "....RR..B..RR...",
                    "................",
                    "................",
                    "................"
                ]
            ],
            boss: [
                [
                    ".......T.T......",
                    ".......T.T......",
                    "....TTOOTTOOT...",
                    ".....TOOTTOOT...",
                    "......TTTTT.....",
                    ".....TYYTYYT....",
                    "...TTTYYYYYTTT..",
                    ".TTTTTYYYYYTTTTT",
                    "..TTTTYYYYYTTTT.",
                    "..TOTT.O.O.TTOT.",
                    ".TTOT..O.O..TOTT",
                    ".TOTT.......TTOT",
                    ".TOOT.......TOOT",
                    ".TOOT.......TOOT",
                    ".TTTT.......TTTT",
                    "..TT.........TT."
                ],
                [
                    "................",
                    ".......T.T......",
                    "....TTOOTTOOT...",
                    ".....TOOTTOOT...",
                    "......TTTTT.....",
                    "....TTYYTYYTT...",
                    "...TTTYYYYYTTT..",
                    ".TTTTTYYYYYTTTTT",
                    "..TTT.YYYYY.TTT.",
                    "...TT..O.O..TT..",
                    "...TT..O.O..TT..",
                    "...TTT.....TTT..",
                    "....TT.....TT...",
                    ".....TT...TT....",
                    "......TT.TT.....",
                    ".......T.T......"
                ]
            ],
            boss_hit: [
                [
                    ".......B.B......",
                    ".......B.B......",
                    "....BBMMBBMMB...",
                    ".....BMMBBMMB...",
                    "......BBBBB.....",
                    ".....BPPBPPB....",
                    "...BBBPPPPPBBB..",
                    ".BBBBBPPPPPBBBBB",
                    "..BBBBPPPPPBBBB.",
                    "..BMBB.M.M.BBMB.",
                    ".BBMB..M.M..BMBB",
                    ".BMBB.......BBMB",
                    ".BMMB.......BMMB",
                    ".BMMB.......BMMB",
                    ".BBBB.......BBBB",
                    "..BB.........BB."
                ],
                [
                    "................",
                    ".......B.B......",
                    "....BBMMBBMMB...",
                    ".....BMMBBMMB...",
                    "......BBBBB.....",
                    "....BBPPBPPBB...",
                    "...BBBPPPPPBBB..",
                    ".BBBBBPPPPPBBBBB",
                    "..BBB.PPPPP.BBB.",
                    "...BB..M.M..BB..",
                    "...BB..M.M..BB..",
                    "...BBB.....BBB..",
                    "....BB.....BB...",
                    ".....BB...BB....",
                    "......BB.BB.....",
                    ".......B.B......"
                ]
            ]
        };
        SPRITES.scorpion = SPRITES.butterfly;

        let gameActive = false, score = 0, level = 1, lives = 3, frame = 0, highScore = 20000;
        let player = null, enemies = [], bullets = [], enemyBullets = [], stars = [], particles = [];
        let tractorBeam = null, isDualShip = false;

        function initStars() {
            stars = [];
            for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * WIDTH, y: Math.random() * HEIGHT, speed: 0.5 + Math.random() * 0.9, color: [PALETTE.W, PALETTE.B, PALETTE.R, PALETTE.Y][Math.floor(Math.random() * 4)] });
        }

        function createExplosion(x, y, count = 20) {
            const colors = [PALETTE.W, PALETTE.Y, PALETTE.R, '#FF8800', PALETTE.C];
            for (let i = 0; i < count; i++) {
                const ang = Math.random() * Math.PI * 2;
                const spd = 0.8 + Math.random() * 3.0;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * spd,
                    vy: Math.sin(ang) * spd,
                    life: 1.0,
                    decay: 0.018 + Math.random() * 0.018,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: 2 + Math.random() * 2
                });
            }
        }

        function drawSprite(data, x, y, rotation = 0, scale = SCALE) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotation);
            data.forEach((row, ri) => {
                for (let ci = 0; ci < row.length; ci++) {
                    const char = row[ci];
                    if (char !== '.' && PALETTE[char]) {
                        ctx.fillStyle = PALETTE[char];
                        ctx.fillRect((ci - 8) * scale, (ri - 8) * scale, scale, scale);
                    }
                }
            });
            ctx.restore();
        }

        class Player {
            constructor() {
                this.x = WIDTH / 2;
                this.y = HEIGHT - 40;
                this.cooldown = 0;
                this.exploding = false;
                this.explodeTimer = 0;
                this.invulnerable = 0;
            }
            update() {
                if (this.exploding) {
                    this.explodeTimer--;
                    if (this.explodeTimer <= 0) {
                        this.exploding = false;
                        this.x = WIDTH / 2;
                        this.invulnerable = 90; // ~1.5s invulnerability upon respawn
                    }
                    return;
                }
                if (this.invulnerable > 0) this.invulnerable--;

                const keyLeft = controllerInvertX ? (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6'])
                                                  : (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4']);
                const keyRight = controllerInvertX ? (keys['ArrowLeft'] || keys['KeyA'] || keys['KeyJ'] || keys['Numpad4'])
                                                   : (keys['ArrowRight'] || keys['KeyD'] || keys['KeyL'] || keys['Numpad6']);
                const moveLeft = keyLeft || touchState.left || gamepadState.left;
                const moveRight = keyRight || touchState.right || gamepadState.right;
                const firePressed = keys['Space'] || keys['Enter'] || keys['NumpadEnter'] || keys['KeyZ'] || keys['KeyX'] || keys['KeyK'] ||
                                    keys['ControlLeft'] || keys['ControlRight'] || keys['ShiftLeft'] || keys['ShiftRight'] ||
                                    touchState.fire || gamepadState.fire;

                if (moveLeft) this.x -= 2.2;
                if (moveRight) this.x += 2.2;
                this.x = Math.max(20, Math.min(WIDTH - (isDualShip ? 48 : 20), this.x));
                if (firePressed && this.cooldown <= 0) {
                    bullets.push({ x: this.x, y: this.y - 15 });
                    if (isDualShip) bullets.push({ x: this.x + 28, y: this.y - 15 });
                    playSfx(800); this.cooldown = 18;
                }
                if (this.cooldown > 0) this.cooldown--;
            }
            draw() {
                if (this.exploding) return;
                if (this.invulnerable > 0 && Math.floor(frame / 6) % 2 === 0) return;
                drawSprite(SPRITES.player, this.x, this.y);
                if (isDualShip) drawSprite(SPRITES.player, this.x + 28, this.y);
            }
        }

        class Enemy {
            constructor(tx, ty, type, delay) {
                this.tx = tx; this.ty = ty; this.type = type;
                this.hp = type === 'boss' ? 2 : 1;
                this.x = WIDTH / 2; this.y = -20;
                this.state = 'wait'; this.timer = delay;
                this.angle = 0; this.phase = 0;
            }
            update() {
                if (this.state === 'wait') { if (this.timer-- <= 0) this.state = 'entry'; return; }
                if (this.state === 'entry') {
                    this.phase += 0.0085;
                    this.x = this.tx + Math.cos(this.phase * 4.5) * (110 * (1 - this.phase));
                    this.y = this.ty + Math.sin(this.phase * 4.5) * (110 * (1 - this.phase)) - (1 - this.phase) * 90;
                    this.angle = this.phase * 4.5 + Math.PI / 2;
                    if (this.phase >= 1) { this.state = 'formation'; this.angle = 0; }
                } else if (this.state === 'formation') {
                    this.x = this.tx + Math.sin(frame * 0.018) * 20;
                    this.y = this.ty + Math.cos(frame * 0.012) * 3;
                    const activeDives = enemies.filter(e => e.state === 'dive').length;
                    const maxDives = Math.min(2 + Math.floor((level - 1) * 0.5), 5);
                    if (activeDives < maxDives && Math.random() < 0.00022 * (1 + (level - 1) * 0.25)) {
                        this.state = 'dive';
                        this.phase = 0;
                    }
                } else if (this.state === 'dive') {
                    this.y += 2.1;
                    this.x += Math.sin(this.y * 0.022) * 2.4;
                    this.angle = Math.PI;
                    if (player && Math.random() < 0.008 && this.y > 60 && this.y < player.y - 80 && enemyBullets.length < 3) {
                        enemyBullets.push({ x: this.x, y: this.y + 10 });
                        playSfx(350, 'sawtooth', 0.05);
                    }
                    if (this.y > HEIGHT + 20) { this.y = -20; this.state = 'entry'; this.phase = 0; }
                }
            }
            draw() {
                if (this.state === 'wait') return;
                const spriteKey = (this.type === 'boss' && this.hp === 1) ? 'boss_hit' : this.type;
                const frames = SPRITES[spriteKey] || SPRITES.bee;
                drawSprite(frames[Math.floor(frame / 32) % 2], this.x, this.y, this.angle);
            }
        }

        function handlePlayerHit(isDualHit = false) {
            if (!gameActive || !player || player.exploding || player.invulnerable > 0) return;

            if (isDualShip) {
                isDualShip = false;
                createExplosion(isDualHit ? player.x + 28 : player.x, player.y, 25);
                playSfx(150, 'sawtooth', 0.3);
                if (!isDualHit) {
                    player.x += 28;
                }
                player.invulnerable = 60;
                return;
            }

            player.exploding = true;
            player.explodeTimer = 60;
            createExplosion(player.x, player.y, 35);
            playSfx(120, 'sawtooth', 0.5);
            lives--;
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = Math.max(0, lives);

            if (lives <= 0) {
                player.explodeTimer = 999999;
                setTimeout(() => {
                    gameActive = false;
                    const titleEl = document.getElementById('menu-title');
                    const subEl = document.getElementById('menu-sub');
                    const btnEl = document.getElementById('start-btn');
                    if (titleEl) titleEl.innerText = "GAME OVER";
                    if (subEl) subEl.innerText = `SCORE: ${score}`;
                    if (btnEl) btnEl.innerText = "PLAY AGAIN";
                    document.getElementById('menu-overlay').style.display = 'flex';
                }, 1200);
            }
        }

        function spawnWave() {
            enemies = [];
            const layouts = [
                { type: 'boss', r: 1, c: 4, ox: 164, oy: 72 },
                { type: 'butterfly', r: 2, c: 8, ox: 84, oy: 108 },
                { type: 'bee', r: 2, c: 10, ox: 44, oy: 176 }
            ];
            let order = 0;
            layouts.forEach(l => {
                for (let i = 0; i < l.r; i++) {
                    for (let j = 0; j < l.c; j++) {
                        enemies.push(new Enemy(l.ox + j * 40, l.oy + i * 34, l.type, order++ * 8));
                    }
                }
            });
        }

        function update() {
            pollGamepad();
            if (!gameActive) return;
            frame++;
            if (player) player.update();
            stars.forEach(s => { s.y += s.speed; if (s.y > HEIGHT) s.y = 0; });

            // Player bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= 6.5;
                let hitEnemy = false;
                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    if (Math.hypot(b.x - e.x, b.y - e.y) < 18) {
                        bullets.splice(i, 1);
                        hitEnemy = true;
                        e.hp = (e.hp || 1) - 1;
                        if (e.hp > 0) {
                            playSfx(240, 'square', 0.08);
                        } else {
                            createExplosion(e.x, e.y, 15);
                            enemies.splice(ei, 1);
                            score += (e.type === 'boss' ? 400 : (e.type === 'butterfly' || e.type === 'scorpion' ? 160 : 100));
                            playSfx(100, 'triangle', 0.15);
                        }
                        break;
                    }
                }
                if (!hitEnemy && b.y < 0) {
                    bullets.splice(i, 1);
                }
            }

            // Enemies update & player collision
            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];
                e.update();
                if (gameActive && player && !player.exploding && player.invulnerable <= 0) {
                    const hitPrimary = Math.hypot(e.x - player.x, e.y - player.y) < 20;
                    const hitDual = isDualShip && Math.hypot(e.x - (player.x + 28), e.y - player.y) < 20;
                    if (hitPrimary || hitDual) {
                        createExplosion(e.x, e.y, 20);
                        playSfx(100, 'triangle', 0.2);
                        enemies.splice(ei, 1);
                        handlePlayerHit(hitDual && !hitPrimary);
                        continue;
                    }
                }
            }

            // Enemy bullets update & player collision
            for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
                const eb = enemyBullets[bi];
                eb.y += 3.2;
                if (eb.y > HEIGHT + 20) {
                    enemyBullets.splice(bi, 1);
                    continue;
                }
                if (gameActive && player && !player.exploding && player.invulnerable <= 0) {
                    const hitPrimary = Math.hypot(eb.x - player.x, eb.y - player.y) < 16;
                    const hitDual = isDualShip && Math.hypot(eb.x - (player.x + 28), eb.y - player.y) < 16;
                    if (hitPrimary || hitDual) {
                        enemyBullets.splice(bi, 1);
                        handlePlayerHit(hitDual && !hitPrimary);
                    }
                }
            }

            // Particles update
            for (let pi = particles.length - 1; pi >= 0; pi--) {
                const p = particles[pi];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(pi, 1);
            }

            if (enemies.length === 0) {
                level++;
                enemyBullets = [];
                spawnWave();
            }

            document.getElementById('score-display').innerText = score.toString().padStart(2, '0');
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').innerText = highScore.toString().padStart(2, '0');
            }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Stars
            stars.forEach(s => { ctx.fillStyle = s.color; ctx.fillRect(s.x, s.y, 2, 2); });

            if (gameActive || player) {
                if (player) player.draw();
                enemies.forEach(e => e.draw());

                // Player bullets (arcade blue tip + red tail)
                bullets.forEach(b => {
                    ctx.fillStyle = PALETTE.B;
                    ctx.fillRect(b.x - 1, b.y - 12, 2, 4);
                    ctx.fillRect(b.x - 3, b.y - 8, 6, 4);
                    ctx.fillStyle = PALETTE.R;
                    ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
                });

                // Enemy bullets (arcade white shaft + red tip)
                enemyBullets.forEach(b => {
                    ctx.fillStyle = PALETTE.W;
                    ctx.fillRect(b.x - 1, b.y - 8, 2, 8);
                    ctx.fillStyle = PALETTE.R;
                    ctx.fillRect(b.x - 3, b.y, 6, 2);
                    ctx.fillRect(b.x - 1, b.y + 2, 2, 4);
                });

                // Particles
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                });
                ctx.globalAlpha = 1.0;

                // Reserve ships HUD (bottom-left)
                for (let i = 0; i < lives - 1; i++) {
                    drawSprite(SPRITES.player, 20 + i * 32, HEIGHT - 18, 0, 1.8);
                }
                // Stage badges (bottom-right, matching arcade red/white/blue chevron)
                for (let i = 0; i < Math.min(level, 10); i++) {
                    const bx = WIDTH - 20 - i * 16, by = HEIGHT - 28;
                    ctx.fillStyle = PALETTE.W;
                    ctx.fillRect(bx, by, 14, 16);
                    ctx.fillStyle = PALETTE.R;
                    ctx.fillRect(bx, by + 2, 14, 4);
                    ctx.fillRect(bx, by + 8, 14, 4);
                    ctx.fillStyle = PALETTE.V;
                    ctx.fillRect(bx + 2, by + 14, 10, 4);
                    ctx.fillStyle = PALETTE.W;
                    ctx.fillRect(bx + 6, by + 14, 2, 2);
                    ctx.fillRect(bx + 4, by + 18, 6, 4);
                }
            }
        }

        const ARCADE_FPS = 60.606;
        const STEP_MS = 1000 / ARCADE_FPS;
        let lastTime = 0, accumulator = 0;

        function loop(timestamp) {
            if (typeof timestamp === 'number') {
                if (!lastTime) lastTime = timestamp;
                const delta = Math.min(timestamp - lastTime, 100);
                lastTime = timestamp;
                accumulator += delta;
                while (accumulator >= STEP_MS) {
                    update();
                    accumulator -= STEP_MS;
                }
            } else {
                update();
            }
            draw();
            requestAnimationFrame(loop);
        }

        const keys = {};
        const touchState = { left: false, right: false, fire: false };
        const gamepadState = { left: false, right: false, fire: false, connected: false, name: '' };
        // Default to normal (false), or load saved preference from localStorage; toggle anytime via [⇄ L/R] or Select (-)
        let controllerInvertX = false;
        try {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('si_invert_lr') !== null) {
                controllerInvertX = localStorage.getItem('si_invert_lr') === '1';
            }
        } catch (e) {}
        let prevGamepadStartPressed = false;
        let prevGamepadSelectPressed = false;

        function ensureAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (e) {}
        }

        function syncFlipButtonUI() {
            const btn = document.getElementById('flip-lr-btn');
            if (btn) {
                btn.innerText = controllerInvertX ? '⇄ L/R: FLIPPED' : '⇄ L/R: NORMAL';
                btn.style.borderColor = controllerInvertX ? '#00ff44' : '#c77dff';
                btn.style.color = controllerInvertX ? '#00ff44' : '#c77dff';
            }
            const statusEl = document.getElementById('gamepad-status');
            if (statusEl && gamepadState.connected) {
                statusEl.innerText = `🎮 CRKD ATOM READY (${controllerInvertX ? 'L/R FLIPPED' : 'L/R NORMAL'} - TAP TO SWAP)`;
            }
        }

        function toggleInvertLR() {
            controllerInvertX = !controllerInvertX;
            try {
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('si_invert_lr', controllerInvertX ? '1' : '0');
                }
            } catch (e) {}
            syncFlipButtonUI();
            playSfx(controllerInvertX ? 880 : 660, 'square', 0.07);
        }

        // Normalize keyboard + Android Gamepad / CRKD ATOM Keyboard-mode key events
        function resolveKeyCodes(e) {
            const codes = [];
            if (e && e.code) codes.push(e.code);
            const k = e && e.key;
            const kc = e && e.keyCode;
            if (k === 'ArrowLeft' || kc === 21 || kc === 37) codes.push('ArrowLeft');
            if (k === 'ArrowRight' || kc === 22 || kc === 39) codes.push('ArrowRight');
            if (k === ' ' || k === 'Enter' ||
                kc === 23 || // KEYCODE_DPAD_CENTER
                kc === 66 || // KEYCODE_ENTER
                kc === 96 || // KEYCODE_BUTTON_A
                kc === 97 || // KEYCODE_BUTTON_B
                kc === 99 || // KEYCODE_BUTTON_X
                kc === 100 || // KEYCODE_BUTTON_Y
                kc === 102 || // KEYCODE_BUTTON_L1
                kc === 103 || // KEYCODE_BUTTON_R1
                kc === 104 || // KEYCODE_BUTTON_L2
                kc === 105 || // KEYCODE_BUTTON_R2
                kc === 108) { // KEYCODE_BUTTON_START
                codes.push('Space');
            }
            return codes;
        }

        window.onkeydown = e => {
            ensureAudio();
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = true; });
            if (!gameActive && (matched.includes('Space') || matched.includes('Enter') || (e && e.keyCode === 108))) {
                if (e && e.preventDefault) e.preventDefault();
                startGame();
            }
        };
        window.onkeyup = e => {
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = false; });
        };

        // Full W3C Gamepad API polling for CRKD ATOM Collectible Keychain Controller
        // Supports Android Mode (Cyan), X-Input Mode (Orange), Switch Mode (White), and Stick-Remap modes
        function isBtnPressed(btn) {
            if (!btn) return false;
            if (typeof btn === 'object') return Boolean(btn.pressed || (btn.value && btn.value > 0.35));
            return Boolean(btn);
        }

        function updateGamepadStatusUI(connected, idStr = '') {
            const statusEl = document.getElementById('gamepad-status');
            if (!statusEl) return;
            if (connected) {
                const isCrkd = /crkd|atom|pro controller|xbox|gamepad|wireless controller/i.test(idStr);
                const label = isCrkd ? '🎮 CRKD ATOM CONTROLLER CONNECTED' : `🎮 CONTROLLER READY (${idStr.slice(0, 22)})`;
                statusEl.innerText = label;
                statusEl.style.color = '#00ff44';
            } else {
                statusEl.innerText = '🎮 CRKD ATOM / GAMEPAD: PRESS ANY BUTTON';
                statusEl.style.color = '#c77dff';
            }
        }

        function pollGamepad() {
            if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
            let pads;
            try {
                pads = navigator.getGamepads();
            } catch (e) {
                return;
            }
            if (!pads) return;

            let left = false, right = false, fire = false, startBtn = false, selectBtn = false;
            let foundPad = null;

            for (let i = 0; i < pads.length; i++) {
                const gp = pads[i];
                if (!gp || gp.connected === false) continue;
                foundPad = gp;
                const btns = gp.buttons || [];
                const axes = gp.axes || [];

                // 1. D-Pad Left / Right (Standard buttons 14 = Left, 15 = Right)
                if (isBtnPressed(btns[14])) left = true;
                if (isBtnPressed(btns[15])) right = true;

                // 2. Analog Axes / CRKD ATOM D-Pad-to-Stick modes:
                //    axes[0] = Left Stick X, axes[2] = Right Stick X, axes[4] / axes[6] = Android D-Input D-Pad X
                const horizAxes = [axes[0], axes[2], axes[4], axes[6]];
                for (let ai = 0; ai < horizAxes.length; ai++) {
                    const val = horizAxes[ai];
                    if (typeof val === 'number' && !Number.isNaN(val)) {
                        if (val < -0.3) left = true;
                        if (val > 0.3) right = true;
                    }
                }

                // 3. DirectInput / Switch Mode 8-way POV Hat Switch on axes[9] (Android Chrome HID mapping)
                if (axes.length >= 10 && typeof axes[9] === 'number') {
                    const hat = axes[9];
                    if (hat >= -0.80 && hat <= -0.05) right = true;
                    if (hat >= 0.35 && hat <= 1.05) left = true;
                }

                // 4. Fire buttons: CRKD ATOM B/A/Y/X face buttons (0, 1, 2, 3) + L/R shoulder buttons (4, 5, 6, 7)
                if (isBtnPressed(btns[0]) || isBtnPressed(btns[1]) ||
                    isBtnPressed(btns[2]) || isBtnPressed(btns[3]) ||
                    isBtnPressed(btns[4]) || isBtnPressed(btns[5]) ||
                    isBtnPressed(btns[6]) || isBtnPressed(btns[7])) {
                    fire = true;
                }

                // Select (-) button (8) toggles L/R direction
                if (isBtnPressed(btns[8])) {
                    selectBtn = true;
                }

                // 5. Start (+), CRKD Home (9, 16) or any face button starts game from menu
                if (isBtnPressed(btns[9]) || isBtnPressed(btns[16]) || fire) {
                    startBtn = true;
                }
            }

            if (selectBtn && !prevGamepadSelectPressed) {
                toggleInvertLR();
            }
            prevGamepadSelectPressed = selectBtn;

            if (foundPad && !gamepadState.connected) {
                gamepadState.connected = true;
                gamepadState.name = foundPad.id || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
                syncFlipButtonUI();
            } else if (!foundPad && gamepadState.connected) {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            }

            if (controllerInvertX) {
                const tmp = left;
                left = right;
                right = tmp;
            }

            gamepadState.left = left;
            gamepadState.right = right;
            gamepadState.fire = fire;

            // Reflect physical controller input on the corner HUD indicators if visible
            const lEl = document.getElementById('l-btn');
            const rEl = document.getElementById('r-btn');
            const fEl = document.getElementById('f-btn');
            if (lEl && lEl.classList && !touchState.left) lEl.classList.toggle('active', left);
            if (rEl && rEl.classList && !touchState.right) rEl.classList.toggle('active', right);
            if (fEl && fEl.classList && !touchState.fire) fEl.classList.toggle('active', fire);

            // Edge-triggered start from menu overlay when pressing Start / B / A / Y / X on CRKD ATOM
            if (startBtn && !prevGamepadStartPressed && !gameActive) {
                ensureAudio();
                startGame();
                if (player) player.cooldown = 14;
            }
            prevGamepadStartPressed = startBtn;
        }

        if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('gamepadconnected', e => {
                const gp = e && e.gamepad;
                gamepadState.connected = true;
                gamepadState.name = (gp && gp.id) || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
                syncFlipButtonUI();
            });
            window.addEventListener('gamepaddisconnected', () => {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            });
        }
        function setBtnState(el, k, state) {
            touchState[k] = state;
            if (el && el.classList) el.classList.toggle('active', state);
        }
        function bind(id, k) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, true);
                ensureAudio();
            };
            const deactivate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, false);
            };
            el.ontouchstart = activate;
            el.ontouchend = deactivate;
            el.ontouchcancel = deactivate;
            el.onmousedown = activate;
            el.onmouseup = deactivate;
            el.onmouseleave = deactivate;
        }
        bind('l-btn', 'left'); bind('r-btn', 'right'); bind('f-btn', 'fire');

        // Allow smooth thumb sliding between Left and Right buttons on the D-pad
        const dpadGroup = document.getElementById('dpad-group');
        if (dpadGroup) {
            const handleDpadTouch = e => {
                if (e && e.preventDefault) e.preventDefault();
                ensureAudio();
                const lEl = document.getElementById('l-btn');
                const rEl = document.getElementById('r-btn');
                if (!lEl || !rEl || !lEl.getBoundingClientRect) return;
                const lRect = lEl.getBoundingClientRect();
                const rRect = rEl.getBoundingClientRect();
                let leftHit = false, rightHit = false;
                const touches = e.touches || [];
                for (let i = 0; i < touches.length; i++) {
                    const t = touches[i];
                    if (t.clientX >= lRect.left - 12 && t.clientX <= lRect.right + 6 &&
                        t.clientY >= lRect.top - 24 && t.clientY <= lRect.bottom + 24) {
                        leftHit = true;
                    }
                    if (t.clientX >= rRect.left - 6 && t.clientX <= rRect.right + 12 &&
                        t.clientY >= rRect.top - 24 && t.clientY <= rRect.bottom + 24) {
                        rightHit = true;
                    }
                }
                setBtnState(lEl, 'left', leftHit);
                setBtnState(rEl, 'right', rightHit);
            };
            dpadGroup.ontouchstart = handleDpadTouch;
            dpadGroup.ontouchmove = handleDpadTouch;
            dpadGroup.ontouchend = handleDpadTouch;
            dpadGroup.ontouchcancel = handleDpadTouch;
        }

        function startGame() {
            score = 0;
            level = 1;
            lives = 3;
            isDualShip = false;
            bullets = [];
            enemyBullets = [];
            particles = [];
            player = new Player();
            spawnWave();
            gameActive = true;
            document.getElementById('score-display').innerText = '00';
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = '3';
            const titleEl = document.getElementById('menu-title');
            if (titleEl) titleEl.innerText = 'Galaga';
            const subEl = document.getElementById('menu-sub');
            if (subEl) subEl.innerText = 'AUTHENTIC REPLICA';
            const btnEl = document.getElementById('start-btn');
            if (btnEl) btnEl.innerText = 'START GAME';
            document.getElementById('menu-overlay').style.display = 'none';
        }

        document.getElementById('start-btn').onclick = startGame;

        const flipBtnEl = document.getElementById('flip-lr-btn');
        if (flipBtnEl) {
            flipBtnEl.onclick = e => {
                if (e && e.stopPropagation) e.stopPropagation();
                ensureAudio();
                toggleInvertLR();
            };
        }
        const gpStatusEl = document.getElementById('gamepad-status');
        if (gpStatusEl) {
            gpStatusEl.style.cursor = 'pointer';
            gpStatusEl.onclick = () => {
                ensureAudio();
                toggleInvertLR();
            };
        }

        window.onload = () => {
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            syncFlipButtonUI();
            initStars();
            loop();
            if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').then(reg => {
                    if (reg && reg.update) reg.update();
                }).catch(() => {});
            }
        };
    </script>
</body>
</html>
