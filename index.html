        // =========================================================================
        // ENEMY CLASS (ENTRY WAVES, BREATHING FORMATION, CONVOY DIVES, TRANSFORMS,
        // TRACTOR BEAM, CHALLENGING STAGE PATTERNS, ROGUE CAPTURED FIGHTER)
        // =========================================================================
        class Enemy {
            constructor(tx, ty, type, delay, opts = {}) {
                this.tx = tx;
                this.ty = ty;
                this.type = type;
                this.hp = type === 'boss' ? 2 : 1;
                this.x = opts.startX ?? WIDTH / 2;
                this.y = opts.startY ?? -24;
                this.state = 'wait';
                this.timer = delay;
                this.angle = 0;
                this.phase = 0;
                this.hasCaptured = false;
                this.tractorTargetX = WIDTH / 2;
                this.entryPath = opts.entryPath || null;
                this.entrySpeed = opts.entrySpeed || 0.0115;
                this.challengingWave = opts.challengingWave ?? -1;
                this.diveType = 'standard';
                this.diveStartX = tx;
                this.diveStartY = ty;
                this.diveDir = 1;
                this.diveShots = 0;
                this.escortLeader = null;
                this.escortOffsetX = 0;
                this.escortOffsetY = 0;
                this.escortCount = 0;
                this.transformGroupId = opts.transformGroupId || 0;
                this.canTransform = Boolean(opts.canTransform);
                this.isRogueFighter = Boolean(opts.isRogueFighter);
            }

            beginDive(diveDir = null) {
                this.state = 'dive';
                this.phase = 0;
                this.diveStartX = this.x;
                this.diveStartY = this.y;
                this.diveDir = diveDir ?? (this.x < WIDTH / 2 ? 1 : -1);
                this.diveShots = 0;
                this.escortCount = 0;
                this.diveType = this.type === 'bee' ? 'bee_loop' : 'weave';
                GalagaSound.playDive();

                // Authentic Boss Galaga + 1 or 2 Butterfly Escort Convoy!
                if (this.type === 'boss' && !this.hasCaptured) {
                    const candidates = enemies.filter(other =>
                        other !== this &&
                        other.type === 'butterfly' &&
                        other.state === 'formation' &&
                        Math.abs(other.tx - this.tx) <= 64
                    ).sort((a, b) => Math.abs(a.tx - this.tx) - Math.abs(b.tx - this.tx));

                    const escorts = candidates.slice(0, 2);
                    this.escortCount = escorts.length;
                    escorts.forEach((esc, idx) => {
                        esc.state = 'escort';
                        esc.escortLeader = this;
                        esc.escortOffsetX = idx === 0 ? -34 : 34;
                        esc.escortOffsetY = 30;
                        esc.diveShots = 0;
                    });
                }

                // Authentic Stage 4+ Transform split (1 enemy morphs into 3 Scorpions/Bosconians/Galaxians!)
                if (this.canTransform && !isChallengingStage) {
                    const tInfo = getTransformTypeForLevel(level);
                    if (tInfo) {
                        this.canTransform = false;
                        const gid = nextTransformGroupId++;
                        this.type = tInfo.type;
                        this.hp = 1;
                        this.transformGroupId = gid;
                        this.diveType = 'weave';
                        transformGroups[gid] = { remaining: 3, bonus: tInfo.bonus, type: tInfo.type };
                        GalagaSound.playTransformSplit();

                        for (let c = -1; c <= 1; c += 2) {
                            const clone = new Enemy(this.tx, this.ty, tInfo.type, 0, {
                                startX: this.x + c * 22,
                                startY: this.y - 14,
                                transformGroupId: gid
                            });
                            clone.state = 'dive';
                            clone.phase = 0.04;
                            clone.diveStartX = this.x + c * 22;
                            clone.diveStartY = this.y - 14;
                            clone.diveDir = this.diveDir;
                            clone.diveType = 'weave';
                            enemies.push(clone);
                        }
                    }
                }
            }

            update() {
                if (this.state === 'wait') {
                    if (this.timer-- <= 0) {
                        this.state = isChallengingStage ? 'challenge' : 'entry';
                        this.phase = 0;
                    }
                    return;
                }

                // Challenging Stage choreographed flight (no firing!)
                if (this.state === 'challenge') {
                    this.phase += this.entrySpeed;
                    if (this.phase >= 1) {
                        this.state = 'done';
                        return;
                    }
                    if (this.entryPath) {
                        const pos = evalPolylinePath(this.entryPath, this.phase);
                        this.x = pos.x;
                        this.y = pos.y;
                        this.angle = pos.angle;
                    }
                    return;
                }

                // Choreographed Stage Entry spline -> docks smoothly into formation slot
                if (this.state === 'entry') {
                    this.phase += this.entrySpeed;
                    if (this.entryPath) {
                        const slot = getFormationSlotPos(this.tx, this.ty);
                        const pathWithTarget = this.entryPath.concat([[slot.x, slot.y]]);
                        const pos = evalPolylinePath(pathWithTarget, Math.min(1, this.phase));
                        this.x = pos.x;
                        this.y = pos.y;
                        this.angle = pos.angle;
                    } else {
                        this.x = this.tx + Math.cos(this.phase * 4.5) * (110 * (1 - this.phase));
                        this.y = this.ty + Math.sin(this.phase * 4.5) * (110 * (1 - this.phase)) - (1 - this.phase) * 90;
                        this.angle = this.phase * 4.5 + Math.PI / 2;
                    }
                    // Stage 2+ entry enemies fire occasional aimed shots during their swoop
                    if (level >= 2 && this.diveShots < 1 && this.phase > 0.35 && this.phase < 0.72 && this.y > 70 && this.y < HEIGHT - 150) {
                        if (Math.random() < 0.0045 * Math.min(level - 1, 5)) {
                            fireAimedEnemyBullet(this.x, this.y);
                            this.diveShots++;
                        }
                    }
                    if (this.phase >= 1) {
                        this.state = 'formation';
                        this.angle = 0;
                        this.entryPath = null;
                    }
                    return;
                }

                if (this.state === 'return') {
                    const slot = getFormationSlotPos(this.tx, this.ty);
                    const dx = slot.x - this.x;
                    const dy = slot.y - this.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 4) {
                        this.x = slot.x;
                        this.y = slot.y;
                        this.angle = 0;
                        this.state = 'formation';
                    } else {
                        this.x += (dx / dist) * 3.0;
                        this.y += (dy / dist) * 3.0;
                        this.angle = Math.atan2(dy, dx) + Math.PI / 2;
                    }
                    return;
                }

                if (this.state === 'formation') {
                    const slot = getFormationSlotPos(this.tx, this.ty);
                    this.x = slot.x;
                    this.y = slot.y;
                    this.angle = 0;

                    // Pause launching new attacks during rescued-fighter docking
                    if (capturedShip) return;

                    const activeDives = enemies.filter(e => e.state === 'dive' || e.state === 'tractor' || e.state === 'escort').length;
                    const stragglerFrenzy = formationEntered && enemies.length <= 4;
                    const maxDives = stragglerFrenzy ? 4 : Math.min(2 + Math.floor((level - 1) * 0.55), 6);
                    const diveProb = stragglerFrenzy
                        ? 0.014
                        : (formationEntered ? 0.00042 : 0.00018) * (1 + (level - 1) * 0.24);

                    if (activeDives < maxDives && Math.random() < diveProb) {
                        const canTractor = this.type === 'boss' &&
                            !this.hasCaptured &&
                            !isDualShip &&
                            !capturedShip &&
                            !tractorBeam &&
                            enemies.length > 1 &&
                            player && !player.exploding && !player.capturing && !player.captured &&
                            !enemies.some(e => e.hasCaptured || e.state === 'tractor');

                        if (canTractor && Math.random() < 0.55) {
                            this.state = 'tractor';
                            this.phase = 0;
                            this.tractorTargetX = Math.max(64, Math.min(WIDTH - 64, player.x));
                            GalagaSound.playDive();
                        } else {
                            this.beginDive();
                        }
                    }
                    return;
                }

                if (this.state === 'escort') {
                    if (!this.escortLeader || !enemies.includes(this.escortLeader) || this.escortLeader.state !== 'dive') {
                        this.escortLeader = null;
                        this.state = 'dive';
                        this.diveType = 'weave';
                        this.diveStartX = this.x;
                        this.diveStartY = this.y;
                        return;
                    }
                    const tx = this.escortLeader.x + this.escortOffsetX;
                    const ty = this.escortLeader.y + this.escortOffsetY;
                    const dx = tx - this.x;
                    const dy = ty - this.y;
                    this.x += dx * 0.22;
                    this.y += dy * 0.22;
                    this.angle = this.escortLeader.angle;
                    if (!capturedShip && player && this.diveShots < 2 && Math.random() < 0.009 && this.y > 70 && this.y < player.y - 90) {
                        fireAimedEnemyBullet(this.x, this.y);
                        this.diveShots++;
                    }
                    return;
                }

                if (this.state === 'tractor') {
                    const hoverY = HEIGHT - 188; // y=324, 148px above player
                    if (this.y < hoverY && !tractorBeam) {
                        this.y += 2.35;
                        const dx = this.tractorTargetX - this.x;
                        this.x += Math.sign(dx) * Math.min(Math.abs(dx), 2.1);
                        this.angle = Math.PI;
                    } else {
                        this.y = hoverY;
                        this.angle = 0;
                        if (!tractorBeam) {
                            tractorBeam = {
                                boss: this,
                                x: this.x,
                                y: this.y + 14,
                                h: 0,
                                maxH: 148,
                                state: 'grow',
                                timer: 165,
                                soundStep: 0
                            };
                            GalagaSound.playTractorBeamTick(0);
                        }
                        if (tractorBeam && tractorBeam.boss === this) {
                            tractorBeam.x = this.x;
                            tractorBeam.y = this.y + 14;
                            if (frame % 7 === 0) {
                                tractorBeam.soundStep++;
                                if (player && player.capturing) {
                                    GalagaSound.playCaptureSirenTick(tractorBeam.soundStep);
                                } else {
                                    GalagaSound.playTractorBeamTick(tractorBeam.soundStep);
                                }
                            }
                            if (tractorBeam.state === 'grow') {
                                tractorBeam.h = Math.min(tractorBeam.maxH, tractorBeam.h + 3.2);
                                if (tractorBeam.h >= tractorBeam.maxH) {
                                    tractorBeam.state = 'active';
                                }
                            } else if (tractorBeam.state === 'active') {
                                tractorBeam.timer--;
                                if (player && !player.exploding && !player.captured && !player.capturing && player.invulnerable <= 0 && !isDualShip) {
                                    if (Math.abs(player.x - this.x) < 34) {
                                        player.capturing = true;
                                        tractorBeam.timer = Math.max(tractorBeam.timer, 120);
                                        GalagaSound.playCaptureSirenTick(0);
                                    }
                                }
                                if (player && player.capturing) {
                                    player.x += (this.x - player.x) * 0.18;
                                    player.y -= 1.9;
                                    if (player.y <= this.y + 26) {
                                        completePlayerCapture(this);
                                        return;
                                    }
                                } else if (tractorBeam.timer <= 0) {
                                    tractorBeam.state = 'shrink';
                                }
                            } else if (tractorBeam.state === 'shrink') {
                                tractorBeam.h -= 3.5;
                                if (tractorBeam.h <= 0) {
                                    tractorBeam = null;
                                    this.state = 'dive';
                                    this.diveType = 'weave';
                                }
                            }
                        } else {
                            this.state = 'dive';
                        }
                    }
                    return;
                }

                if (this.state === 'dive') {
                    const prevX = this.x, prevY = this.y;
                    const speedMult = 1 + Math.min((level - 1) * 0.055, 0.45);
                    this.phase += 0.014 * speedMult;

                    const stragglerLoop = formationEntered && enemies.length <= 4;
                    if (this.diveType === 'bee_loop' && !stragglerLoop && this.y > HEIGHT - 115 && this.phase > 0.75) {
                        // Classic Galaga Bee bottom U-turn swoop back to formation
                        this.state = 'return';
                        return;
                    }

                    // Initial peel-out upward arc like real 1981 Galaga, then aggressive weaving dive
                    if (this.phase < 0.22) {
                        const a = (this.phase / 0.22) * Math.PI;
                        this.x += this.diveDir * 1.8 * Math.sin(a);
                        this.y -= 1.3 * Math.cos(a);
                    } else {
                        const homing = (player && !player.exploding && !player.captured)
                            ? Math.sign(player.x - this.x) * 0.55
                            : 0;
                        this.y += 2.35 * speedMult;
                        this.x += (Math.sin(this.phase * 5.2) * 2.55 * this.diveDir) + homing;
                        this.x = Math.max(18, Math.min(WIDTH - 18, this.x));
                    }

                    const vx = this.x - prevX;
                    const vy = this.y - prevY;
                    if (Math.hypot(vx, vy) > 0.2) {
                        this.angle = Math.atan2(vy, vx) + Math.PI / 2;
                    }

                    const maxShots = level === 1 ? 1 : 2;
                    if (!capturedShip && player && this.diveShots < maxShots && this.y > 70 && this.y < player.y - 85) {
                        if (Math.random() < 0.011 * (1 + (level - 1) * 0.14)) {
                            fireAimedEnemyBullet(this.x, this.y);
                            this.diveShots++;
                        }
                    }

                    if (this.y > HEIGHT + 24) {
                        if (this.transformGroupId || this.isRogueFighter) {
                            if (this.transformGroupId && transformGroups[this.transformGroupId]) {
                                delete transformGroups[this.transformGroupId];
                            }
                            this.state = 'done';
                            return;
                        }
                        this.y = -20;
                        if (stragglerLoop) {
                            // Relentless end-of-stage wraparound attack!
                            this.phase = 0.25;
                            this.diveShots = 0;
                        } else {
                            this.state = 'return';
                            this.phase = 0;
                        }
                    }
                }
            }

            draw() {
                if (this.state === 'wait' || this.state === 'done') return;
                if (this.isRogueFighter) {
                    drawSprite(SPRITES.captured_player, this.x, this.y, this.angle);
                    return;
                }
                const spriteKey = (this.type === 'boss' && this.hp === 1) ? 'boss_hit' : this.type;
                const frames = SPRITES[spriteKey] || SPRITES.bee;
                const flapSpeed = (this.state === 'formation') ? 28 : 14;
                drawSprite(frames[Math.floor(frame / flapSpeed) % frames.length], this.x, this.y, this.angle);
                if (this.hasCaptured) {
                    const capOffset = 26;
                    const capX = this.x - Math.sin(this.angle) * capOffset;
                    const capY = this.y - Math.cos(this.angle) * capOffset;
                    drawSprite(SPRITES.captured_player, capX, capY, this.angle);
                }
            }
        }

        function handlePlayerHit(isDualHit = false) {
            if (!gameActive || !player || player.exploding || player.invulnerable > 0) return;

            if (isDualShip) {
                isDualShip = false;
                createExplosion(isDualHit ? player.x + 28 : player.x, player.y, 26, true);
                GalagaSound.playPlayerExplosion();
                if (!isDualHit) {
                    player.x += 28;
                }
                player.invulnerable = 65;
                return;
            }

            player.exploding = true;
            player.explodeTimer = 60;
            createExplosion(player.x, player.y, 38, true);
            GalagaSound.playPlayerExplosion();
            lives--;
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = Math.max(0, lives);

            if (lives <= 0) {
                player.explodeTimer = 999999;
                setTimeout(() => {
                    showGameOverScreen();
                }, 1200);
            }
        }

        // =========================================================================
        // AUTHENTIC 5-SQUADRON STAGE ENTRY & CHALLENGING STAGE SPAWNERS
        // =========================================================================
        function spawnChallengingWave() {
            enemies = [];
            challengingHits = 0;
            challengingWaveHits = [0, 0, 0, 0, 0];
            challengingResult = null;
            formationEntered = false;
            stageIntroTimer = 115;
            statusBannerText = 'CHALLENGING STAGE';
            statusBannerColor = PALETTE.C;
            statusBannerTimer = 115;
            GalagaSound.playChallengingStart();

            const patternSet = Math.floor((level - 3) / 4) % 4;
            const wavePaths = [
                // Wave 0: Sweep from top-left across center loop and out right
                [[160, -24], [190, 150], [320, 250], [260, 355], [140, 320], [180, 210], [472, 130]],
                // Wave 1: Mirror sweep from bottom-left looping high right
                [[-24, 380], [120, 320], [240, 210], [340, 290], [240, 370], [150, 240], [472, 80]],
                // Wave 2: Mirror sweep from bottom-right looping high left
                [[472, 380], [328, 320], [208, 210], [108, 290], [208, 370], [298, 240], [-24, 80]],
                // Wave 3: Top-right figure-8 ribbon
                [[288, -24], [260, 140], [120, 230], [190, 345], [330, 280], [220, 180], [-24, 150]],
                // Wave 4: Center twin spiral out top-sides
                [[224, -24], [110, 150], [224, 290], [348, 220], [224, 140], [100, 270], [472, 220]]
            ];
            const bonusTypes = ['bee', 'butterfly', 'scorpion', 'bosconian', 'galaxian'];

            for (let w = 0; w < 5; w++) {
                const baseDelay = 95 + w * 145;
                const path = wavePaths[(w + patternSet) % wavePaths.length];
                const type = w === 1 ? 'boss' : bonusTypes[(w + patternSet) % bonusTypes.length];
                for (let k = 0; k < 8; k++) {
                    const e = new Enemy(WIDTH / 2, 120, type === 'boss' && k % 2 === 1 ? 'butterfly' : type, baseDelay + k * 9, {
                        startX: path[0][0],
                        startY: path[0][1],
                        entryPath: path,
                        entrySpeed: 0.0072,
                        challengingWave: w
                    });
                    // In Challenging Stages, even Boss-shaped targets are 1-hit like original Galaga!
                    e.hp = 1;
                    enemies.push(e);
                }
            }
        }

        function spawnWave() {
            isChallengingStage = isChallengingLevel(level);
            transformGroups = {};
            formationClock = 0;
            formationBreath = 0;
            formationEntered = false;
            challengingResult = null;

            if (isChallengingStage) {
                spawnChallengingWave();
                return;
            }

            enemies = [];
            const introBase = (level === 1) ? 250 : 54;
            stageIntroTimer = introBase;
            statusBannerText = `STAGE ${level}`;
            statusBannerColor = PALETTE.C;
            statusBannerTimer = introBase;

            if (level === 1) {
                GalagaSound.playStartTheme();
            } else {
                GalagaSound.playStageFlagTick();
            }

            // Authentic 5-row 40-enemy Galaga formation:
            // Row 0: 4 Boss Galagas, Rows 1-2: 16 Butterflies, Rows 3-4: 20 Bees
            const bosses = [];
            for (let j = 0; j < 4; j++) bosses.push({ tx: 164 + j * 40, ty: 72, type: 'boss' });

            const butterflies = [];
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 8; j++) butterflies.push({ tx: 84 + j * 40, ty: 108 + i * 34, type: 'butterfly' });
            }

            const bees = [];
            for (let i = 0; i < 2; i++) {
                for (let j = 0; j < 10; j++) bees.push({ tx: 44 + j * 40, ty: 176 + i * 34, type: 'bee' });
            }

            // 5 Authentic 8-Alien Choreographed Entry Squadrons
            const pathTopLeft = [[180, -24], [195, 110], [330, 235], [275, 340], [160, 295]];
            const pathTopRight = [[268, -24], [253, 110], [118, 235], [173, 340], [288, 295]];
            const pathBotLeft = [[-24, 400], [120, 350], [205, 255], [135, 195], [88, 265], [140, 315]];
            const pathBotRight = [[472, 400], [328, 350], [243, 255], [313, 195], [360, 265], [308, 315]];
            const pathLoopRight = [[250, -24], [295, 140], [385, 275], [310, 350], [230, 260]];
            const pathLoopLeft = [[198, -24], [153, 140], [63, 275], [138, 350], [218, 260]];

            const squadrons = [
                // Wave 1 (8): 4 center Bees (left stream) + 4 center Butterflies (right stream)
                [
                    { spec: bees[4], path: pathTopLeft }, { spec: butterflies[3], path: pathTopRight },
                    { spec: bees[5], path: pathTopLeft }, { spec: butterflies[4], path: pathTopRight },
                    { spec: bees[14], path: pathTopLeft }, { spec: butterflies[11], path: pathTopRight },
                    { spec: bees[15], path: pathTopLeft }, { spec: butterflies[12], path: pathTopRight }
                ],
                // Wave 2 (8): 4 Boss Galagas + 4 left-side Butterflies from bottom-left
                [
                    { spec: bosses[0], path: pathBotLeft }, { spec: butterflies[0], path: pathBotLeft },
                    { spec: bosses[1], path: pathBotLeft }, { spec: butterflies[1], path: pathBotLeft },
                    { spec: bosses[2], path: pathBotLeft }, { spec: butterflies[8], path: pathBotLeft },
                    { spec: bosses[3], path: pathBotLeft }, { spec: butterflies[9], path: pathBotLeft }
                ],
                // Wave 3 (8): 8 remaining Butterflies from bottom-right
                [
                    { spec: butterflies[2], path: pathBotRight }, { spec: butterflies[5], path: pathBotRight },
                    { spec: butterflies[6], path: pathBotRight }, { spec: butterflies[7], path: pathBotRight },
                    { spec: butterflies[10], path: pathBotRight }, { spec: butterflies[13], path: pathBotRight },
                    { spec: butterflies[14], path: pathBotRight }, { spec: butterflies[15], path: pathBotRight }
                ],
                // Wave 4 (8): 8 right-side Bees sweeping from top-right
                [
                    { spec: bees[6], path: pathLoopRight }, { spec: bees[7], path: pathLoopRight },
                    { spec: bees[8], path: pathLoopRight }, { spec: bees[9], path: pathLoopRight },
                    { spec: bees[16], path: pathLoopRight }, { spec: bees[17], path: pathLoopRight },
                    { spec: bees[18], path: pathLoopRight }, { spec: bees[19], path: pathLoopRight }
                ],
                // Wave 5 (8): 8 left-side Bees sweeping from top-left
                [
                    { spec: bees[0], path: pathLoopLeft }, { spec: bees[1], path: pathLoopLeft },
                    { spec: bees[2], path: pathLoopLeft }, { spec: bees[3], path: pathLoopLeft },
                    { spec: bees[10], path: pathLoopLeft }, { spec: bees[11], path: pathLoopLeft },
                    { spec: bees[12], path: pathLoopLeft }, { spec: bees[13], path: pathLoopLeft }
                ]
            ];

            const hasTransforms = level >= 4;
            let transformAssigned = 0;

            squadrons.forEach((sq, sIdx) => {
                const sqBase = introBase + sIdx * 62;
                sq.forEach((item, k) => {
                    const canTrans = hasTransforms &&
                        transformAssigned < 2 &&
                        (item.spec.type === 'bee' || item.spec.type === 'butterfly') &&
                        (sIdx === 2 || sIdx === 3) && k === 2;
                    if (canTrans) transformAssigned++;
                    enemies.push(new Enemy(item.spec.tx, item.spec.ty, item.spec.type, sqBase + k * 7, {
                        startX: item.path[0][0],
                        startY: item.path[0][1],
                        entryPath: item.path,
                        entrySpeed: 0.0115 + Math.min((level - 1) * 0.0005, 0.003),
                        canTransform: canTrans
                    }));
                });
            });
        }

        // =========================================================================
        // MAIN UPDATE LOOP (60.606 Hz ARCADE TIMESTEP)
        // =========================================================================
        function update() {
            pollGamepad();
            if (!gameActive) return;
            frame++;

            if (stageIntroTimer > 0) stageIntroTimer--;

            // Freeze starfield briefly during Challenging Stage results tally (just like 1981 hardware)
            starScrollPaused = Boolean(challengingResult) || (player && player.capturing);
            if (!starScrollPaused) {
                stars.forEach(s => {
                    s.y += s.speed;
                    if (s.y > HEIGHT) {
                        s.y = 0;
                        s.x = Math.floor(Math.random() * (WIDTH / 2)) * 2;
                    }
                });
            }

            // Challenging Stage Results Tally Sequence
            if (challengingResult) {
                challengingResult.timer++;
                if (challengingResult.timer > 35 && challengingResult.shownHits < challengingResult.hits && challengingResult.timer % 2 === 0) {
                    challengingResult.shownHits++;
                    if (challengingResult.shownHits % 2 === 0) GalagaSound.playStageFlagTick();
                }
                if (challengingResult.shownHits >= challengingResult.hits && !challengingResult.awarded) {
                    challengingResult.awarded = true;
                    addScore(challengingResult.bonus);
                    GalagaSound.playChallengingClear(challengingResult.isPerfect);
                }
                if (challengingResult.awarded && challengingResult.timer > (challengingResult.isPerfect ? 230 : 165)) {
                    challengingResult = null;
                    level++;
                    enemyBullets = [];
                    tractorBeam = null;
                    spawnWave();
                }
                if (player) player.update();
                updateEffects();
                syncScoreHUD();
                return;
            }

            if (player) player.update();

            // Check if all initial 40 enemies have docked into formation -> enable Breathing Pulse
            if (!isChallengingStage && !formationEntered && enemies.length > 0) {
                const anyEntering = enemies.some(e => e.state === 'wait' || e.state === 'entry');
                if (!anyEntering) formationEntered = true;
            }
            formationClock++;
            if (formationEntered) formationBreath++;

            // Drive authentic looping 1981 Ambience (sound 0) & Tractor Beam / Capture loops (sounds 5 & 6)
            const wantBeamMode = tractorBeam ? ((player && player.capturing) ? 6 : 5) : 0;
            const wantAmbience = !isChallengingStage &&
                enemies.length > 0 &&
                !capturedShip &&
                stageIntroTimer <= 0 &&
                player && !player.exploding && !player.capturing && !player.captured;
            GalagaSound.syncLoops(wantAmbience, enemies.length <= 8, wantBeamMode);

            // Player bullets collision
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.y -= 10.5;
                let hitSomething = false;

                for (let ei = enemies.length - 1; ei >= 0; ei--) {
                    const e = enemies[ei];
                    if (e.state === 'wait' || e.state === 'done') continue;

                    // Check accidental hit on a captured red fighter riding above its Boss
                    if (e.hasCaptured) {
                        const capX = e.x - Math.sin(e.angle) * 26;
                        const capY = e.y - Math.cos(e.angle) * 26;
                        if (Math.hypot(b.x - capX, b.y - capY) < 15) {
                            bullets.splice(i, 1);
                            hitsLanded++;
                            hitSomething = true;
                            e.hasCaptured = false;
                            createExplosion(capX, capY, 22, true);
                            GalagaSound.playEnemyDestroy('boss');
                            const pts = (e.state === 'formation') ? 500 : 1000;
                            addScore(pts, capX, capY, PALETTE.R);
                            break;
                        }
                    }

                    if (Math.hypot(b.x - e.x, b.y - e.y) < 18) {
                        bullets.splice(i, 1);
                        hitsLanded++;
                        hitSomething = true;
                        e.hp = (e.hp || 1) - 1;

                        if (e.hp > 0) {
                            GalagaSound.playBossHit1();
                        } else {
                            createExplosion(e.x, e.y, e.type === 'boss' ? 22 : 14);
                            GalagaSound.playEnemyDestroy(e.type);

                            if (tractorBeam && tractorBeam.boss === e) {
                                tractorBeam = null;
                                if (player && player.capturing) {
                                    player.capturing = false;
                                    player.y = HEIGHT - 42;
                                    player.captureAngle = 0;
                                }
                            }

                            if (e.hasCaptured) {
                                if (e.state === 'formation') {
                                    // Authentic 1981 arcade: destroying Boss in formation makes captured fighter turn rogue!
                                    const rogue = new Enemy(e.x, e.y - 26, 'bee', 0, {
                                        startX: e.x,
                                        startY: e.y - 26,
                                        isRogueFighter: true
                                    });
                                    rogue.state = 'dive';
                                    rogue.diveType = 'weave';
                                    rogue.phase = 0.25;
                                    enemies.push(rogue);
                                } else {
                                    // Destroying Boss while DIVING rescues the captured fighter!
                                    capturedShip = { x: e.x, y: e.y - 26, angle: 0, spinTimer: 34 };
                                    statusBannerText = 'FIGHTER RESCUED!';
                                    statusBannerColor = PALETTE.C;
                                    statusBannerTimer = 95;
                                    GalagaSound.playRescuedTheme();
                                }
                            }

                            // Authentic 1981 Galaga Scoring Table
                            let pts = 50;
                            if (isChallengingStage) {
                                pts = 100;
                                challengingHits++;
                                if (e.challengingWave >= 0 && e.challengingWave < 5) {
                                    challengingWaveHits[e.challengingWave]++;
                                    if (challengingWaveHits[e.challengingWave] === 8) {
                                        const waveBonuses = [1000, 1000, 1500, 2000, 3000];
                                        const wBonus = waveBonuses[e.challengingWave] || 1000;
                                        addScore(wBonus, e.x, e.y, PALETTE.Y);
                                        GalagaSound.playBonusChime();
                                    }
                                }
                            } else if (e.isRogueFighter) {
                                pts = 1000;
                            } else if (e.transformGroupId && transformGroups[e.transformGroupId]) {
                                pts = 160;
                                const grp = transformGroups[e.transformGroupId];
                                grp.remaining--;
                                if (grp.remaining <= 0) {
                                    addScore(grp.bonus, e.x, e.y, PALETTE.Y);
                                    GalagaSound.playBonusChime();
                                    delete transformGroups[e.transformGroupId];
                                }
                            } else if (e.type === 'boss') {
                                if (e.state === 'formation') {
                                    pts = 150;
                                } else {
                                    // Count live escorts flying with this diving Boss!
                                    const aliveEscorts = enemies.filter(o => o.escortLeader === e).length;
                                    if (aliveEscorts >= 2) {
                                        pts = 1600;
                                        GalagaSound.playBonusChime();
                                    } else if (aliveEscorts === 1) {
                                        pts = 800;
                                    } else {
                                        pts = 400;
                                    }
                                }
                            } else if (e.type === 'butterfly' || e.type === 'scorpion' || e.type === 'bosconian' || e.type === 'galaxian') {
                                pts = (e.state === 'formation') ? 80 : 160;
                            } else {
                                pts = (e.state === 'formation') ? 50 : 100;
                            }

                            enemies.splice(ei, 1);
                            addScore(pts, pts >= 400 ? e.x : null, pts >= 400 ? e.y : null);
                        }
                        break;
                    }
                }
                if (!hitSomething && b.y < -12) {
                    bullets.splice(i, 1);
                }
            }

            // Rescued fighter spin & docking sequence -> Dual Fighter
            if (capturedShip) {
                if (capturedShip.spinTimer > 0) {
                    capturedShip.spinTimer--;
                    capturedShip.angle += 0.36;
                } else {
                    capturedShip.angle = 0;
                    const targetX = (player && !player.exploding && !player.captured) ? Math.min(WIDTH - 48, player.x) + 28 : WIDTH / 2 + 14;
                    const targetY = HEIGHT - 42;
                    const dx = targetX - capturedShip.x;
                    const dy = targetY - capturedShip.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist < 10 && player && !player.exploding && !player.captured) {
                        player.x = Math.min(WIDTH - 48, player.x);
                        isDualShip = true;
                        capturedShip = null;
                        addScore(1000, player.x + 14, player.y - 24, PALETTE.Y);
                        statusBannerText = 'DUAL FIGHTER!';
                        statusBannerColor = PALETTE.Y;
                        statusBannerTimer = 85;
                        GalagaSound.playBonusChime();
                    } else {
                        capturedShip.x += (dx / Math.max(1, dist)) * 3.8;
                        capturedShip.y += (dy / Math.max(1, dist)) * 3.8;
                    }
                }
            }

            if (statusBannerTimer > 0) statusBannerTimer--;

            // Enemies update & player collision
            for (let ei = enemies.length - 1; ei >= 0; ei--) {
                const e = enemies[ei];
                e.update();
                if (e.state === 'done') {
                    enemies.splice(ei, 1);
                    continue;
                }
                if (e.state === 'wait') continue;
                if (gameActive && player && !player.exploding && !player.capturing && !player.captured && player.invulnerable <= 0) {
                    const hitPrimary = Math.hypot(e.x - player.x, e.y - player.y) < 19;
                    const hitDual = isDualShip && Math.hypot(e.x - (player.x + 28), e.y - player.y) < 19;
                    if (hitPrimary || hitDual) {
                        createExplosion(e.x, e.y, 18);
                        GalagaSound.playEnemyDestroy(e.type);
                        enemies.splice(ei, 1);
                        handlePlayerHit(hitDual && !hitPrimary);
                        continue;
                    }
                }
            }

            // Enemy aimed bullets update & player collision
            for (let bi = enemyBullets.length - 1; bi >= 0; bi--) {
                const eb = enemyBullets[bi];
                eb.x += (eb.vx ?? 0);
                eb.y += (eb.vy ?? 3.4);
                if (eb.y > HEIGHT + 20 || eb.x < -20 || eb.x > WIDTH + 20) {
                    enemyBullets.splice(bi, 1);
                    continue;
                }
                if (gameActive && player && !player.exploding && !player.capturing && !player.captured && player.invulnerable <= 0) {
                    const hitPrimary = Math.hypot(eb.x - player.x, eb.y - player.y) < 15;
                    const hitDual = isDualShip && Math.hypot(eb.x - (player.x + 28), eb.y - player.y) < 15;
                    if (hitPrimary || hitDual) {
                        enemyBullets.splice(bi, 1);
                        handlePlayerHit(hitDual && !hitPrimary);
                    }
                }
            }

            updateEffects();

            // Stage completion -> Challenging Stage Tally OR next stage
            if (enemies.length === 0 && !capturedShip) {
                if (isChallengingStage) {
                    const isPerfect = challengingHits >= 40;
                    challengingResult = {
                        timer: 0,
                        hits: challengingHits,
                        shownHits: 0,
                        bonus: isPerfect ? 10000 : challengingHits * 100,
                        isPerfect,
                        awarded: false
                    };
                    enemyBullets = [];
                    tractorBeam = null;
                } else {
                    level++;
                    enemyBullets = [];
                    tractorBeam = null;
                    spawnWave();
                }
            }

            syncScoreHUD();
        }

        function updateEffects() {
            for (let pi = particles.length - 1; pi >= 0; pi--) {
                const p = particles[pi];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                if (p.life <= 0) particles.splice(pi, 1);
            }
            for (let xi = explosions.length - 1; xi >= 0; xi--) {
                const ex = explosions[xi];
                ex.tick++;
                if (ex.tick >= ex.ticksPerFrame) {
                    ex.tick = 0;
                    ex.frame++;
                    if (ex.frame >= ex.maxFrames) explosions.splice(xi, 1);
                }
            }
            for (let si = scorePopups.length - 1; si >= 0; si--) {
                const sp = scorePopups[si];
                sp.y -= 0.35;
                sp.timer--;
                if (sp.timer <= 0) scorePopups.splice(si, 1);
            }
        }

        function syncScoreHUD() {
            document.getElementById('score-display').innerText = score.toString().padStart(2, '0');
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').innerText = highScore.toString().padStart(2, '0');
            }
        }

        // =========================================================================
        // AUTHENTIC 1981 STAGE FLAGS (50, 30, 20, 10, 5, 1 PENNANTS)
        // =========================================================================
        function decomposeStageFlags(lvl) {
            let rem = Math.max(1, lvl);
            const denoms = [50, 30, 20, 10, 5, 1];
            const flags = [];
            for (let i = 0; i < denoms.length; i++) {
                while (rem >= denoms[i]) {
                    flags.push(denoms[i]);
                    rem -= denoms[i];
                }
            }
            return flags;
        }

        function drawStageFlags(lvl) {
            const flags = decomposeStageFlags(lvl);
            let cursorX = WIDTH - 14;
            const by = HEIGHT - 28;
            // Draw right-to-left (smallest flags on right, large pennants on left, matching arcade)
            for (let i = flags.length - 1; i >= 0; i--) {
                const val = flags[i];
                const isBig = val >= 10;
                const w = isBig ? 22 : 12;
                cursorX -= w;
                if (cursorX < 140) break;

                if (val === 50) {
                    ctx.fillStyle = PALETTE.Y; ctx.fillRect(cursorX, by, 20, 18);
                    ctx.fillStyle = PALETTE.R; ctx.fillRect(cursorX + 2, by + 2, 16, 10);
                    ctx.fillStyle = PALETTE.B; ctx.fillRect(cursorX + 5, by + 4, 10, 6);
                    ctx.fillStyle = PALETTE.W; ctx.fillRect(cursorX, by + 18, 3, 6);
                } else if (val === 30) {
                    ctx.fillStyle = PALETTE.Y; ctx.fillRect(cursorX, by, 20, 16);
                    ctx.fillStyle = PALETTE.R; ctx.fillRect(cursorX + 3, by + 3, 14, 10);
                    ctx.fillStyle = PALETTE.W; ctx.fillRect(cursorX, by + 16, 3, 8);
                } else if (val === 20) {
                    ctx.fillStyle = PALETTE.C; ctx.fillRect(cursorX, by, 20, 16);
                    ctx.fillStyle = PALETTE.R; ctx.fillRect(cursorX + 3, by + 3, 14, 10);
                    ctx.fillStyle = PALETTE.W; ctx.fillRect(cursorX, by + 16, 3, 8);
                } else if (val === 10) {
                    ctx.fillStyle = PALETTE.R; ctx.fillRect(cursorX, by, 18, 14);
                    ctx.fillStyle = PALETTE.Y; ctx.fillRect(cursorX + 2, by + 2, 14, 10);
                    ctx.fillStyle = PALETTE.R; ctx.fillRect(cursorX + 5, by + 5, 8, 4);
                    ctx.fillStyle = PALETTE.W; ctx.fillRect(cursorX, by + 14, 3, 10);
                } else if (val === 5) {
                    ctx.fillStyle = PALETTE.Y; ctx.fillRect(cursorX, by + 2, 10, 12);
                    ctx.fillStyle = PALETTE.B; ctx.fillRect(cursorX + 2, by + 4, 8, 6);
                    ctx.fillStyle = PALETTE.W; ctx.fillRect(cursorX, by + 14, 2, 10);
                } else {
                    ctx.fillStyle = PALETTE.R; ctx.fillRect(cursorX, by + 4, 10, 10);
                    ctx.fillStyle = PALETTE.Y; ctx.fillRect(cursorX + 2, by + 6, 6, 4);
                    ctx.fillStyle = PALETTE.W; ctx.fillRect(cursorX, by + 14, 2, 10);
                }
                cursorX -= 4;
            }
        }

        // =========================================================================
        // RENDERER
        // =========================================================================
        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Authentic twinkling Galaga multi-layer starfield
            stars.forEach(s => {
                if (((frame + s.blinkOffset) % 44) < 34) {
                    ctx.fillStyle = s.color;
                    ctx.fillRect(s.x, s.y, 2, 2);
                }
            });

            if (gameActive || player) {
                // Authentic 1981 Namco striped concentric Tractor Beam cone
                if (tractorBeam && tractorBeam.h > 0) {
                    const bands = Math.floor(tractorBeam.h / 7);
                    const beamColors = [PALETTE.B, PALETTE.C, PALETTE.V, PALETTE.W];
                    for (let b = 0; b < bands; b++) {
                        const by = tractorBeam.y + b * 7;
                        const progress = (b * 7) / tractorBeam.maxH;
                        const halfW = 8 + progress * 36;
                        ctx.fillStyle = beamColors[(b + Math.floor(frame / 3)) % beamColors.length];
                        ctx.fillRect(tractorBeam.x - halfW, by, halfW * 2, 4);
                    }
                }

                if (player) player.draw();
                if (capturedShip) {
                    drawSprite(SPRITES.player, capturedShip.x, capturedShip.y, capturedShip.angle || 0);
                }
                enemies.forEach(e => e.draw());

                // Multi-frame arcade pixel starburst explosions
                explosions.forEach(ex => {
                    const sprite = EXPLOSION_ENEMY_FRAMES[Math.min(ex.frame, EXPLOSION_ENEMY_FRAMES.length - 1)];
                    drawSprite(sprite, ex.x, ex.y, 0, ex.scale);
                });

                // Player bullets (authentic blue nose + white core + red tail)
                bullets.forEach(b => {
                    ctx.fillStyle = PALETTE.B;
                    ctx.fillRect(b.x - 1, b.y - 12, 2, 4);
                    ctx.fillRect(b.x - 3, b.y - 8, 6, 4);
                    ctx.fillStyle = PALETTE.W;
                    ctx.fillRect(b.x - 1, b.y - 8, 2, 4);
                    ctx.fillStyle = PALETTE.R;
                    ctx.fillRect(b.x - 1, b.y - 4, 2, 8);
                });

                // Enemy bullets (authentic white shaft + red/yellow tip)
                enemyBullets.forEach(b => {
                    ctx.fillStyle = PALETTE.W;
                    ctx.fillRect(b.x - 1, b.y - 8, 2, 8);
                    ctx.fillStyle = PALETTE.R;
                    ctx.fillRect(b.x - 3, b.y, 6, 2);
                    ctx.fillStyle = PALETTE.Y;
                    ctx.fillRect(b.x - 1, b.y + 2, 2, 4);
                });

                // Sparks
                particles.forEach(p => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.life);
                    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                });
                ctx.globalAlpha = 1.0;

                // Floating arcade bonus score popups (400, 800, 1000, 1600, 2000, 3000)
                if (ctx.fillText) {
                    ctx.font = 'bold 13px "Courier New", monospace';
                    ctx.textAlign = 'center';
                    scorePopups.forEach(sp => {
                        ctx.fillStyle = sp.color;
                        ctx.fillText(sp.text, sp.x, sp.y);
                    });
                }

                // Stage / Status banners
                if (statusBannerTimer > 0 && statusBannerText && ctx.fillText) {
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 17px "Courier New", monospace';
                    if (level === 1 && stageIntroTimer > 0 && statusBannerText === 'STAGE 1') {
                        ctx.fillStyle = PALETTE.C;
                        ctx.fillText('PLAYER 1', WIDTH / 2, HEIGHT / 2 - 6);
                        if (stageIntroTimer <= 130) {
                            ctx.fillStyle = PALETTE.Y;
                            ctx.fillText('STAGE 1', WIDTH / 2, HEIGHT / 2 + 22);
                        }
                    } else {
                        ctx.fillStyle = statusBannerColor;
                        ctx.fillText(statusBannerText, WIDTH / 2, HEIGHT / 2 + 12);
                    }
                }

                // Authentic Challenging Stage Tally Screen
                if (challengingResult && ctx.fillText) {
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 16px "Courier New", monospace';
                    if (challengingResult.isPerfect && challengingResult.awarded) {
                        ctx.fillStyle = (Math.floor(frame / 8) % 2 === 0) ? PALETTE.R : PALETTE.Y;
                        ctx.fillText('PERFECT !', WIDTH / 2, HEIGHT / 2 - 42);
                    }
                    ctx.fillStyle = PALETTE.C;
                    ctx.fillText(`NUMBER OF HITS    ${String(challengingResult.shownHits).padStart(2, ' ')}`, WIDTH / 2, HEIGHT / 2);
                    if (challengingResult.awarded) {
                        ctx.fillStyle = PALETTE.Y;
                        const label = challengingResult.isPerfect ? 'SPECIAL BONUS' : 'BONUS';
                        ctx.fillText(`${label}  ${challengingResult.bonus}`, WIDTH / 2, HEIGHT / 2 + 34);
                    }
                }

                // Reserve ships HUD (bottom-left)
                for (let i = 0; i < Math.min(Math.max(0, lives - 1), 6); i++) {
                    drawSprite(SPRITES.player, 20 + i * 30, HEIGHT - 18, 0, 1.75);
                }

                // Authentic 1981 Stage Flags (bottom-right: 50/30/20/10/5/1)
                drawStageFlags(level);
            }
        }

        const ARCADE_FPS = 60.606;
        const STEP_MS = 1000 / ARCADE_FPS;
        let lastTime = 0, accumulator = 0;

        function loop(timestamp) {
            if (typeof timestamp === 'number') {
                if (!lastTime) lastTime = timestamp;
                const delta = Math.min(timestamp - lastTime, 100);
                lastTime = timestamp;
                accumulator += delta;
                while (accumulator >= STEP_MS) {
                    update();
                    accumulator -= STEP_MS;
                }
            } else {
                update();
            }
            draw();
            requestAnimationFrame(loop);
        }

        // =========================================================================
        // INPUT HANDLING (KEYBOARD, TOUCH, CRKD ATOM / W3C GAMEPAD)
        // =========================================================================
        const keys = {};
        const touchState = { left: false, right: false, fire: false };
        const gamepadState = { left: false, right: false, fire: false, connected: false, name: '' };
        let controllerInvertX = false;
        try {
            if (typeof localStorage !== 'undefined' && localStorage.getItem('galaga_invert_lr') !== null) {
                controllerInvertX = localStorage.getItem('galaga_invert_lr') === '1';
            }
        } catch (e) {}
        let prevGamepadStartPressed = false;
        let prevGamepadSelectPressed = false;

        function ensureAudio() {
            GalagaSound.unlock();
        }

        function syncFlipButtonUI() {
            const btn = document.getElementById('flip-lr-btn');
            if (btn) {
                btn.innerText = controllerInvertX ? '⇄ L/R: FLIPPED' : '⇄ L/R: NORMAL';
                btn.style.borderColor = controllerInvertX ? '#00ff44' : '#c77dff';
                btn.style.color = controllerInvertX ? '#00ff44' : '#c77dff';
            }
            const statusEl = document.getElementById('gamepad-status');
            if (statusEl && gamepadState.connected) {
                statusEl.innerText = `🎮 CRKD ATOM READY (${controllerInvertX ? 'L/R FLIPPED' : 'L/R NORMAL'} - TAP TO SWAP)`;
            }
        }

        function toggleInvertLR() {
            controllerInvertX = !controllerInvertX;
            try {
                if (typeof localStorage !== 'undefined') {
                    localStorage.setItem('galaga_invert_lr', controllerInvertX ? '1' : '0');
                }
            } catch (e) {}
            syncFlipButtonUI();
            playSfx(controllerInvertX ? 880 : 660, 'square', 0.07);
        }

        function toggleSoundMute() {
            soundMuted = !soundMuted;
            if (soundMuted) GalagaSound.stopAll();
            const btn = document.getElementById('sound-btn');
            if (btn) {
                btn.innerText = soundMuted ? '🔇 MUTED' : '🔊 SFX';
                btn.style.borderColor = soundMuted ? '#ff5555' : '#00ffff';
                btn.style.color = soundMuted ? '#ff5555' : '#00ffff';
            }
            if (!soundMuted) GalagaSound.playCoin();
        }

        function resolveKeyCodes(e) {
            const codes = [];
            if (e && e.code) codes.push(e.code);
            const k = e && e.key;
            const kc = e && e.keyCode;
            if (k === 'ArrowLeft' || kc === 21 || kc === 37) codes.push('ArrowLeft');
            if (k === 'ArrowRight' || kc === 22 || kc === 39) codes.push('ArrowRight');
            if (k === ' ' || k === 'Enter' ||
                kc === 23 || kc === 66 || kc === 96 || kc === 97 ||
                kc === 99 || kc === 100 || kc === 102 || kc === 103 ||
                kc === 104 || kc === 105 || kc === 108) {
                codes.push('Space');
            }
            return codes;
        }

        window.onkeydown = e => {
            ensureAudio();
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = true; });
            if (e && (e.code === 'KeyM')) toggleSoundMute();
            if (!gameActive && (matched.includes('Space') || matched.includes('Enter') || (e && e.keyCode === 108))) {
                if (e && e.preventDefault) e.preventDefault();
                startGame();
            }
        };
        window.onkeyup = e => {
            const matched = resolveKeyCodes(e);
            matched.forEach(c => { keys[c] = false; });
        };

        function isBtnPressed(btn) {
            if (!btn) return false;
            if (typeof btn === 'object') return Boolean(btn.pressed || (btn.value && btn.value > 0.35));
            return Boolean(btn);
        }

        function updateGamepadStatusUI(connected, idStr = '') {
            const statusEl = document.getElementById('gamepad-status');
            if (!statusEl) return;
            if (connected) {
                const isCrkd = /crkd|atom|pro controller|xbox|gamepad|wireless controller/i.test(idStr);
                const label = isCrkd ? '🎮 CRKD ATOM CONTROLLER CONNECTED' : `🎮 CONTROLLER READY (${idStr.slice(0, 22)})`;
                statusEl.innerText = label;
                statusEl.style.color = '#00ff44';
            } else {
                statusEl.innerText = '🎮 CRKD ATOM / GAMEPAD: PRESS ANY BUTTON';
                statusEl.style.color = '#c77dff';
            }
        }

        function pollGamepad() {
            if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
            let pads;
            try {
                pads = navigator.getGamepads();
            } catch (e) {
                return;
            }
            if (!pads) return;

            let left = false, right = false, fire = false, startBtn = false, selectBtn = false;
            let foundPad = null;

            for (let i = 0; i < pads.length; i++) {
                const gp = pads[i];
                if (!gp || gp.connected === false) continue;
                foundPad = gp;
                const btns = gp.buttons || [];
                const axes = gp.axes || [];

                if (isBtnPressed(btns[14])) left = true;
                if (isBtnPressed(btns[15])) right = true;

                const horizAxes = [axes[0], axes[2], axes[4], axes[6]];
                for (let ai = 0; ai < horizAxes.length; ai++) {
                    const val = horizAxes[ai];
                    if (typeof val === 'number' && !Number.isNaN(val)) {
                        if (val < -0.3) left = true;
                        if (val > 0.3) right = true;
                    }
                }

                if (axes.length >= 10 && typeof axes[9] === 'number') {
                    const hat = axes[9];
                    if (hat >= -0.80 && hat <= -0.05) right = true;
                    if (hat >= 0.35 && hat <= 1.05) left = true;
                }

                if (isBtnPressed(btns[0]) || isBtnPressed(btns[1]) ||
                    isBtnPressed(btns[2]) || isBtnPressed(btns[3]) ||
                    isBtnPressed(btns[4]) || isBtnPressed(btns[5]) ||
                    isBtnPressed(btns[6]) || isBtnPressed(btns[7])) {
                    fire = true;
                }

                if (isBtnPressed(btns[8])) selectBtn = true;
                if (isBtnPressed(btns[9]) || isBtnPressed(btns[16]) || fire) startBtn = true;
            }

            if (selectBtn && !prevGamepadSelectPressed) toggleInvertLR();
            prevGamepadSelectPressed = selectBtn;

            if (foundPad && !gamepadState.connected) {
                gamepadState.connected = true;
                gamepadState.name = foundPad.id || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
                syncFlipButtonUI();
            } else if (!foundPad && gamepadState.connected) {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            }

            if (controllerInvertX) {
                const tmp = left;
                left = right;
                right = tmp;
            }

            gamepadState.left = left;
            gamepadState.right = right;
            gamepadState.fire = fire;

            const lEl = document.getElementById('l-btn');
            const rEl = document.getElementById('r-btn');
            const fEl = document.getElementById('f-btn');
            if (lEl && lEl.classList && !touchState.left) lEl.classList.toggle('active', left);
            if (rEl && rEl.classList && !touchState.right) rEl.classList.toggle('active', right);
            if (fEl && fEl.classList && !touchState.fire) fEl.classList.toggle('active', fire);

            if (startBtn && !prevGamepadStartPressed && !gameActive) {
                ensureAudio();
                startGame();
                if (player) player.cooldown = 14;
            }
            prevGamepadStartPressed = startBtn;
        }

        if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('gamepadconnected', e => {
                const gp = e && e.gamepad;
                gamepadState.connected = true;
                gamepadState.name = (gp && gp.id) || 'CRKD ATOM';
                updateGamepadStatusUI(true, gamepadState.name);
                syncFlipButtonUI();
            });
            window.addEventListener('gamepaddisconnected', () => {
                gamepadState.connected = false;
                gamepadState.name = '';
                updateGamepadStatusUI(false);
            });
        }

        function setBtnState(el, k, state) {
            touchState[k] = state;
            if (el && el.classList) el.classList.toggle('active', state);
        }
        function bind(id, k) {
            const el = document.getElementById(id);
            if (!el) return;
            const activate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, true);
                ensureAudio();
            };
            const deactivate = e => {
                if (e && e.preventDefault) e.preventDefault();
                setBtnState(el, k, false);
            };
            el.ontouchstart = activate;
            el.ontouchend = deactivate;
            el.ontouchcancel = deactivate;
            el.onmousedown = activate;
            el.onmouseup = deactivate;
            el.onmouseleave = deactivate;
        }
        bind('l-btn', 'left'); bind('r-btn', 'right'); bind('f-btn', 'fire');

        const dpadGroup = document.getElementById('dpad-group');
        if (dpadGroup) {
            const handleDpadTouch = e => {
                if (e && e.preventDefault) e.preventDefault();
                ensureAudio();
                const lEl = document.getElementById('l-btn');
                const rEl = document.getElementById('r-btn');
                if (!lEl || !rEl || !lEl.getBoundingClientRect) return;
                const lRect = lEl.getBoundingClientRect();
                const rRect = rEl.getBoundingClientRect();
                let leftHit = false, rightHit = false;
                const touches = e.touches || [];
                for (let i = 0; i < touches.length; i++) {
                    const t = touches[i];
                    if (t.clientX >= lRect.left - 12 && t.clientX <= lRect.right + 6 &&
                        t.clientY >= lRect.top - 24 && t.clientY <= lRect.bottom + 24) {
                        leftHit = true;
                    }
                    if (t.clientX >= rRect.left - 6 && t.clientX <= rRect.right + 12 &&
                        t.clientY >= rRect.top - 24 && t.clientY <= rRect.bottom + 24) {
                        rightHit = true;
                    }
                }
                setBtnState(lEl, 'left', leftHit);
                setBtnState(rEl, 'right', rightHit);
            };
            dpadGroup.ontouchstart = handleDpadTouch;
            dpadGroup.ontouchmove = handleDpadTouch;
            dpadGroup.ontouchend = handleDpadTouch;
            dpadGroup.ontouchcancel = handleDpadTouch;
        }

        function startGame() {
            ensureAudio();
            GalagaSound.stopAll();
            score = 0;
            level = 1;
            lives = 3;
            shotsFired = 0;
            hitsLanded = 0;
            nextExtraLife = 20000;
            isDualShip = false;
            tractorBeam = null;
            capturedShip = null;
            challengingResult = null;
            statusBannerTimer = 0;
            bullets = [];
            enemyBullets = [];
            particles = [];
            explosions = [];
            scorePopups = [];
            player = new Player();
            spawnWave();
            gameActive = true;
            document.getElementById('score-display').innerText = '00';
            const livesEl = document.getElementById('lives-display');
            if (livesEl) livesEl.innerText = '3';
            const label1up = document.getElementById('label-1up');
            if (label1up && label1up.classList) label1up.classList.add('blink-active');
            const titleEl = document.getElementById('menu-title');
            if (titleEl) titleEl.innerText = 'GALAGA';
            const subEl = document.getElementById('menu-sub');
            if (subEl) subEl.innerText = '1981 NAMCO ARCADE';
            const btnEl = document.getElementById('start-btn');
            if (btnEl) btnEl.innerText = 'START GAME';
            const resPanel = document.getElementById('results-panel');
            if (resPanel && resPanel.style) resPanel.style.display = 'none';
            document.getElementById('menu-overlay').style.display = 'none';
        }

        document.getElementById('start-btn').onclick = startGame;

        let deferredInstallPrompt = null;
        if (typeof window !== 'undefined' && window.addEventListener) {
            window.addEventListener('beforeinstallprompt', e => {
                e.preventDefault();
                deferredInstallPrompt = e;
                const installBtn = document.getElementById('install-btn');
                if (installBtn && installBtn.style) installBtn.style.display = 'inline-block';
            });
            window.addEventListener('appinstalled', () => {
                deferredInstallPrompt = null;
                const installBtn = document.getElementById('install-btn');
                if (installBtn && installBtn.style) installBtn.style.display = 'none';
            });
        }
        const installBtnEl = document.getElementById('install-btn');
        if (installBtnEl) {
            installBtnEl.onclick = async () => {
                if (!deferredInstallPrompt) return;
                deferredInstallPrompt.prompt();
                await deferredInstallPrompt.userChoice;
                deferredInstallPrompt = null;
                if (installBtnEl.style) installBtnEl.style.display = 'none';
            };
        }

        const flipBtnEl = document.getElementById('flip-lr-btn');
        if (flipBtnEl) {
            flipBtnEl.onclick = e => {
                if (e && e.stopPropagation) e.stopPropagation();
                ensureAudio();
                toggleInvertLR();
            };
        }
        const soundBtnEl = document.getElementById('sound-btn');
        if (soundBtnEl) {
            soundBtnEl.onclick = e => {
                if (e && e.stopPropagation) e.stopPropagation();
                ensureAudio();
                toggleSoundMute();
            };
        }
        const gpStatusEl = document.getElementById('gamepad-status');
        if (gpStatusEl) {
            gpStatusEl.style.cursor = 'pointer';
            gpStatusEl.onclick = () => {
                ensureAudio();
                toggleInvertLR();
            };
        }

        window.onload = () => {
            canvas.width = WIDTH;
            canvas.height = HEIGHT;
            syncFlipButtonUI();
            initStars();
            loop();
            if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
                const hadController = Boolean(navigator.serviceWorker.controller);
                let refreshing = false;
                if (navigator.serviceWorker.addEventListener) {
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (hadController && !refreshing && typeof window !== 'undefined' && window.location && window.location.reload) {
                            refreshing = true;
                            window.location.reload();
                        }
                    });
                }
                navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).then(reg => {
                    if (reg && reg.update) reg.update();
                    if (typeof document !== 'undefined' && document.addEventListener) {
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible' && reg && reg.update) reg.update();
                        });
                    }
                }).catch(() => {});
            }
        };
    </script>
</body>
</html>
