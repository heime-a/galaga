// Audio
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSfx(type) {
    ensureAudio();
    const t = audioCtx.currentTime;
    const g = audioCtx.createGain();
    g.connect(audioCtx.destination);
    if (type === 'shoot') {
        const o = audioCtx.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(860, t); o.frequency.exponentialRampToValueAtTime(200, t+0.06);
        g.gain.setValueAtTime(0.06, t); g.gain.linearRampToValueAtTime(0, t+0.06);
        o.connect(g); o.start(t); o.stop(t+0.06);
    } else if (type === 'enemyHit') {
        const o = audioCtx.createOscillator(); o.type='triangle';
        o.frequency.setValueAtTime(400, t); o.frequency.exponentialRampToValueAtTime(60, t+0.15);
        g.gain.setValueAtTime(0.07, t); g.gain.linearRampToValueAtTime(0, t+0.15);
        o.connect(g); o.start(t); o.stop(t+0.15);
    } else if (type === 'playerDie') {
        for (let i = 0; i < 4; i++) {
            const o = audioCtx.createOscillator(); o.type='sawtooth';
            const gt2 = audioCtx.createGain(); gt2.connect(audioCtx.destination);
            o.frequency.setValueAtTime(300 - i*60, t+i*0.12);
            o.frequency.exponentialRampToValueAtTime(30, t+i*0.12+0.12);
            gt2.gain.setValueAtTime(0.06, t+i*0.12);
            gt2.gain.linearRampToValueAtTime(0, t+i*0.12+0.12);
            o.connect(gt2); o.start(t+i*0.12); o.stop(t+i*0.12+0.12);
        }
    } else if (type === 'enemyShoot') {
        const o = audioCtx.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(80, t+0.08);
        g.gain.setValueAtTime(0.03, t); g.gain.linearRampToValueAtTime(0, t+0.08);
        o.connect(g); o.start(t); o.stop(t+0.08);
    } else if (type === 'stageStart') {
        [523,659,784].forEach((f,i) => {
            const o = audioCtx.createOscillator(); o.type='square';
            const gt2 = audioCtx.createGain(); gt2.connect(audioCtx.destination);
            o.frequency.setValueAtTime(f, t+i*0.12);
            gt2.gain.setValueAtTime(0.05, t+i*0.12);
            gt2.gain.linearRampToValueAtTime(0, t+i*0.12+0.1);
            o.connect(gt2); o.start(t+i*0.12); o.stop(t+i*0.12+0.1);
        });
    }
}

// Sprite rendering
function drawSprite(data, x, y, scale, rotation) {
    scale = scale || S;
    rotation = rotation || 0;
    const h = data.length, w = data[0].length;
    ctx.save();
    ctx.translate(x, y);
    if (rotation) ctx.rotate(rotation);
    for (let r = 0; r < h; r++) {
        for (let c = 0; c < w; c++) {
            const ch = data[r][c];
            if (ch !== '.' && PAL[ch]) {
                ctx.fillStyle = PAL[ch];
                ctx.fillRect((c - w/2) * scale, (r - h/2) * scale, scale, scale);
            }
        }
    }
    ctx.restore();
}

// Game state
let gameState = 'title';
let score = 0, highScore = 20000, stage = 1, lives = 3, frame = 0;

let explosions = [], stars = [], scorePopups = [];

let stageTimer = 0, respawnTimer = 0, gameOverTimer = 0;

// Input
const keys = {};
const touchState = { left: false, right: false, fire: false };
window.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.code] = false; });
function bindTouch(id, k) {
    const el = document.getElementById(id);
    if (!el) return;
    const onDown = e => { e.preventDefault(); ensureAudio(); touchState[k] = true; };
    const onUp = e => { e.preventDefault(); touchState[k] = false; };
    el.addEventListener('touchstart', onDown);
    el.addEventListener('touchend', onUp);
    el.addEventListener('mousedown', onDown);
    el.addEventListener('mouseup', onUp);
}
bindTouch('l-btn','left'); bindTouch('r-btn','right'); bindTouch('f-btn','fire');

function keyLeft() { return keys['ArrowLeft'] || keys['KeyA'] || touchState.left; }
function keyRight() { return keys['ArrowRight'] || keys['KeyD'] || touchState.right; }
function keyFire() { return keys['Space'] || keys['KeyZ'] || keys['ArrowUp'] || touchState.fire; }

// Stars
function initStars() {
    stars = [];
    for (let i = 0; i < 50; i++) {
        stars.push({ x: Math.random()*W, y: Math.random()*H, speed: 0.3+Math.random()*0.7, brightness: Math.random() });
    }
}
function updateStars() {
    stars.forEach(s => { s.y += s.speed; if (s.y > H) { s.y = 0; s.x = Math.random()*W; } });
}
function drawStars() {
    stars.forEach(s => {
        const b = Math.floor(s.brightness * 155 + 100);
        ctx.fillStyle = 'rgb('+b+','+b+','+b+')';
        ctx.fillRect(Math.floor(s.x), Math.floor(s.y), 1, 1);
    });
}

// Explosion
class Explosion {
    constructor(x, y, big) {
        this.x = x; this.y = y; this.frame = 0;
        this.maxFrame = big ? 30 : 18;
        this.done = false;
        this.particles = [];
        const count = big ? 16 : 8;
        const colors = big ? ['#FF0','#F80','#F00','#FFF'] : ['#FFF','#0FF','#FF0'];
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI*2/count)*i + Math.random()*0.3;
            const speed = (big?2:1.5) + Math.random()*(big?2:1);
            this.particles.push({ x:0, y:0, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
                color: colors[Math.floor(Math.random()*colors.length)], size: big?3:2 });
        }
    }
    update() {
        this.frame++;
        this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; });
        if (this.frame >= this.maxFrame) this.done = true;
    }
    draw() {
        const alpha = 1 - this.frame / this.maxFrame;
        this.particles.forEach(p => {
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.fillRect(this.x+p.x-p.size/2, this.y+p.y-p.size/2, p.size, p.size);
        });
        ctx.globalAlpha = 1;
    }
}

// Score popup
class ScorePopup {
    constructor(x, y, value) { this.x = x; this.y = y; this.value = value; this.timer = 40; }
    update() { this.y -= 0.5; this.timer--; }
    draw() {
        ctx.globalAlpha = this.timer / 40;
        ctx.fillStyle = '#FFF'; ctx.font = '12px monospace'; ctx.textAlign = 'center';
        ctx.fillText(this.value, this.x, this.y);
        ctx.globalAlpha = 1;
    }
}

// Player
class Player {
    constructor() { this.x = W/2; this.y = H-50; this.cooldown = 0; this.speed = 3; }
    update() {
        if (keyLeft()) this.x -= this.speed;
        if (keyRight()) this.x += this.speed;
        const hw = isDualShip ? 28 : 16;
        this.x = Math.max(hw, Math.min(W - hw, this.x));
        if (keyFire() && this.cooldown <= 0 && playerBullets.length < 2) {
            if (isDualShip) {
                playerBullets.push({x:this.x-12, y:this.y-14});
                playerBullets.push({x:this.x+20, y:this.y-14});
            } else {
                playerBullets.push({x:this.x, y:this.y-14});
            }
            shotsFired++; playSfx('shoot'); this.cooldown = 10;
        }
        if (this.cooldown > 0) this.cooldown--;
    }
    draw() {
        drawSprite(SPR.player, this.x, this.y);
        if (isDualShip) drawSprite(SPR.player, this.x+32, this.y);
    }
}

// Formation
const FORM_SX = 32, FORM_SY = 32, FORM_TOP = 70;
function getFormationPos(row, col) {
    let cols;
    if (row === 0) cols = 4;
    else if (row <= 2) cols = 8;
    else cols = 10;
    const ox = (W - (cols-1)*FORM_SX) / 2;
    return { x: ox + col*FORM_SX, y: FORM_TOP + row*FORM_SY };
}

// Enemy
class Enemy {
    constructor(row, col, type) {
        this.row = row; this.col = col; this.type = type;
        const fp = getFormationPos(row, col);
        this.formX = fp.x; this.formY = fp.y;
        this.x = -20; this.y = -20;
        this.state = 'waiting';
        this.hp = type === 'boss' ? 2 : 1;
        this.angle = 0;
        this.entryPath = null; this.entryT = 0;
        this.divePhase = 0; this.diveStartX = 0; this.diveStartY = 0; this.diveSide = 1;
        this.shootTimer = 0;
        this.hasCaptured = false;
    }
    getFormWorldPos() { return { x: this.formX + formationX, y: this.formY }; }
    startEntry(path) { this.state = 'entering'; this.entryPath = path; this.entryT = 0; this.x = path[0].x; this.y = path[0].y; }
    startDive() {
        if (this.state !== 'formation') return;
        this.state = 'diving'; this.divePhase = 0;
        this.diveStartX = this.x; this.diveStartY = this.y;
        this.diveSide = (player && player.x > this.x) ? 1 : -1;
        this.shootTimer = 20 + Math.random()*30;
    }
    update() {
        if (this.state === 'waiting') return;
        if (this.state === 'entering') {
            this.entryT += 0.012;
            if (this.entryT >= 1) {
                this.state = 'formation';
                const fp = this.getFormWorldPos();
                this.x = fp.x; this.y = fp.y; this.angle = 0;
                return;
            }
            const path = this.entryPath;
            const idx = Math.min(Math.floor(this.entryT*(path.length-1)), path.length-2);
            const lt = (this.entryT*(path.length-1)) - idx;
            const p0 = path[idx], p1 = path[Math.min(idx+1, path.length-1)];
            const prevX = this.x, prevY = this.y;
            this.x = p0.x + (p1.x-p0.x)*lt;
            this.y = p0.y + (p1.y-p0.y)*lt;
            this.angle = Math.atan2(this.y-prevY, this.x-prevX) + Math.PI/2;
        }
        if (this.state === 'formation') {
            const fp = this.getFormWorldPos();
            this.x = fp.x; this.y = fp.y; this.angle = 0;
            const base = this.type==='boss' ? 0.0003 : this.type==='butterfly' ? 0.0004 : 0.0005;
            const chance = base * Math.min(stage, 10);
            if (Math.random() < chance && enemies.filter(e=>e.state==='diving').length < 3) this.startDive();
        }
        if (this.state === 'diving') {
            this.divePhase += 0.015;
            if (this.divePhase < 0.3) {
                const t2 = this.divePhase / 0.3;
                const la = t2 * Math.PI * 1.5;
                const lr = 50;
                this.x = this.diveStartX + Math.sin(la)*lr*this.diveSide;
                this.y = this.diveStartY + (1-Math.cos(la))*lr*0.6 + t2*60;
                this.angle = la * this.diveSide * 0.8;
            } else {
                this.y += 3 + stage*0.15;
                if (player) {
                    const dx = player.x - this.x;
                    this.x += Math.sign(dx) * Math.min(Math.abs(dx)*0.02, 1.5);
                }
                this.x += Math.sin(this.divePhase*12)*1.5;
                this.angle = Math.sin(this.divePhase*8)*0.3;
            }
            this.shootTimer--;
            if (this.shootTimer <= 0 && enemyBullets.length < 6) {
                let aimX = 0, aimY = 1;
                if (player) {
                    const dx = player.x-this.x, dy = player.y-this.y;
                    const dist = Math.hypot(dx, dy);
                    if (dist > 0) { aimX = dx/dist; aimY = dy/dist; }
                }
                enemyBullets.push({x:this.x, y:this.y+8, vx:aimX*3, vy:aimY*3});
                playSfx('enemyShoot');
                this.shootTimer = 30 + Math.random()*40;
            }
            if (this.y > H+30) {
                this.y = -30;
                this.x = this.getFormWorldPos().x;
                this.state = 'entering'; this.entryT = 0.7;
                const fp = this.getFormWorldPos();
                this.entryPath = [{x:this.x,y:-30},{x:this.x+(Math.random()-0.5)*60,y:fp.y-40},{x:fp.x,y:fp.y}];
            }
        }
    }
    draw() {
        if (this.state === 'waiting') return;
        const af = Math.floor(frame/15) % 2;
        let sprData;
        if (this.type === 'boss') sprData = this.hp <= 1 ? SPR.bossHit[af] : SPR.boss[af];
        else sprData = SPR[this.type][af];
        drawSprite(sprData, this.x, this.y, S, this.angle);
        if (this.hasCaptured && this.state === 'formation') drawSprite(SPR.player, this.x, this.y+30, S, Math.PI);
    }
}

// Entry paths (bezier curves)
function makeEntryPath(startSide, targetX, targetY) {
    const path = [];
    const steps = 20;
    let sx, sy;
    if (startSide==='topLeft') { sx=60; sy=-20; }
    else if (startSide==='topRight') { sx=W-60; sy=-20; }
    else if (startSide==='left') { sx=-20; sy=H*0.3; }
    else { sx=W+20; sy=H*0.3; }
    const cx1 = sx+(targetX-sx)*0.3+(Math.random()-0.5)*100;
    const cy1 = sy+(targetY-sy)*0.4;
    const cx2 = targetX+(Math.random()-0.5)*60;
    const cy2 = targetY-60;
    for (let i = 0; i <= steps; i++) {
        const t2 = i/steps, u = 1-t2;
        path.push({
            x: u*u*u*sx + 3*u*u*t2*cx1 + 3*u*t2*t2*cx2 + t2*t2*t2*targetX,
            y: u*u*u*sy + 3*u*u*t2*cy1 + 3*u*t2*t2*cy2 + t2*t2*t2*targetY
        });
    }
    return path;
}

// Wave spawning
function spawnWave() {
    enemies = []; playerBullets = []; enemyBullets = []; entryQueue = [];
    for (let c = 0; c < 4; c++) enemies.push(new Enemy(0, c, 'boss'));
    for (let r = 1; r <= 2; r++)
        for (let c = 0; c < 8; c++) enemies.push(new Enemy(r, c, 'butterfly'));
    for (let r = 3; r <= 4; r++)
        for (let c = 0; c < 10; c++) enemies.push(new Enemy(r, c, 'bee'));
    const sides = ['topLeft','topRight','left','right'];
    let delay = 0;
    const groups = [
        enemies.filter(e=>e.type==='boss'),
        enemies.filter(e=>e.type==='butterfly'&&e.row===1),
        enemies.filter(e=>e.type==='butterfly'&&e.row===2),
        enemies.filter(e=>e.type==='bee'&&e.row===3),
        enemies.filter(e=>e.type==='bee'&&e.row===4)
    ];
    groups.forEach((grp, gi) => {
        const side = sides[gi % sides.length];
        grp.forEach((e, i) => { entryQueue.push({enemy:e, side:side, delay:delay+i*6}); });
        delay += grp.length*6 + 30;
    });
}

function updateEntries() {
    for (let i = entryQueue.length-1; i >= 0; i--) {
        entryQueue[i].delay--;
        if (entryQueue[i].delay <= 0) {
            const eq = entryQueue[i];
            const fp = eq.enemy.getFormWorldPos();
            eq.enemy.startEntry(makeEntryPath(eq.side, fp.x, fp.y));
            entryQueue.splice(i, 1);
        }
    }
}

// Collisions
function checkCollisions() {
    for (let bi = playerBullets.length-1; bi >= 0; bi--) {
        const b = playerBullets[bi];
        for (let ei = enemies.length-1; ei >= 0; ei--) {
            const e = enemies[ei];
            if (e.state === 'waiting') continue;
            if (Math.abs(b.x-e.x) < 14 && Math.abs(b.y-e.y) < 14) {
                playerBullets.splice(bi, 1);
                shotsHit++;
                e.hp--;
                if (e.hp <= 0) {
                    const pts = getScore(e);
                    score += pts;
                    if (score > highScore) highScore = score;
                    scorePopups.push(new ScorePopup(e.x, e.y, pts));
                    explosions.push(new Explosion(e.x, e.y, e.type==='boss'));
                    playSfx('enemyHit');
                    if (e.hasCaptured && player) isDualShip = true;
                    enemies.splice(ei, 1);
                } else { playSfx('enemyHit'); }
                break;
            }
        }
    }
    if (player && gameState === 'playing') {
        for (let bi = enemyBullets.length-1; bi >= 0; bi--) {
            const b = enemyBullets[bi];
            const pw = isDualShip ? 28 : 14;
            if (Math.abs(b.x-player.x) < pw && Math.abs(b.y-player.y) < 14) {
                enemyBullets.splice(bi, 1); killPlayer(); break;
            }
        }
        for (let ei = enemies.length-1; ei >= 0; ei--) {
            const e = enemies[ei];
            if (e.state==='waiting'||e.state==='formation') continue;
            const pw = isDualShip ? 28 : 14;
            if (Math.abs(e.x-player.x)<pw && Math.abs(e.y-player.y)<14) {
                explosions.push(new Explosion(e.x, e.y));
                enemies.splice(ei, 1); killPlayer(); break;
            }
        }
    }
}

function getScore(e) {
    const diving = e.state === 'diving';
    if (e.type==='boss') return diving ? 400 : 150;
    if (e.type==='butterfly') return diving ? 160 : 80;
    return diving ? 100 : 50;
}

function killPlayer() {
    if (gameState !== 'playing') return;
    explosions.push(new Explosion(player.x, player.y, true));
    playSfx('playerDie');
    if (isDualShip) { isDualShip = false; return; }
    lives--;
    gameState = 'playerDying';
    respawnTimer = 90;
}

// HUD
function drawHUD() {
    ctx.font = 'bold 16px monospace';
    if (frame%40 < 30) { ctx.fillStyle='#F00'; ctx.textAlign='left'; ctx.fillText('1UP', 30, 20); }
    ctx.fillStyle='#FFF'; ctx.textAlign='left';
    ctx.fillText(score.toString().padStart(6,' '), 16, 36);
    ctx.fillStyle='#F00'; ctx.textAlign='center';
    ctx.fillText('HIGH SCORE', W/2, 20);
    ctx.fillStyle='#FFF'; ctx.textAlign='center';
    ctx.fillText(highScore.toString().padStart(6,' '), W/2, 36);
    // Lives
    for (let i = 0; i < Math.min(lives-1, 5); i++) {
        const lx = 24+i*18, ly = H-14;
        const data = SPR.life;
        for (let r = 0; r < data.length; r++)
            for (let c = 0; c < data[r].length; c++) {
                const ch = data[r][c];
                if (ch!=='.'&&PAL[ch]) { ctx.fillStyle=PAL[ch]; ctx.fillRect(lx+c, ly+r, 1, 1); }
            }
    }
    // Stage badges
    let bx = W-20, rem = stage;
    while (rem >= 5) { ctx.fillStyle='#0FF'; ctx.fillRect(bx-8,H-18,10,12); ctx.fillStyle='#000'; ctx.fillRect(bx-6,H-16,6,8); bx-=14; rem-=5; }
    while (rem >= 1) { ctx.fillStyle='#0FF'; ctx.fillRect(bx-3,H-14,6,8); ctx.fillStyle='#000'; ctx.fillRect(bx-1,H-12,2,4); bx-=10; rem--; }
}

// Stage intro
function drawStageIntro() {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); drawStars();
    ctx.font='bold 20px monospace'; ctx.textAlign='center';
    ctx.fillStyle='#0FF'; ctx.fillText('STAGE '+stage, W/2, H/2-20);
    if (stageTimer < 90) { ctx.fillStyle='#F00'; ctx.fillText('READY', W/2, H/2+20); }
    drawHUD();
}

// Title
function drawTitle() {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); drawStars();
    ctx.font='bold 48px monospace'; ctx.textAlign='center';
    ctx.fillStyle='#F00'; ctx.fillText('GALAGA', W/2, H/2-60);
    ctx.font='12px monospace'; ctx.fillStyle='#888';
    ctx.fillText('\u00A9 1981 NAMCO LTD.', W/2, H/2-30);
    if (frame%60<40) { ctx.font='bold 16px monospace'; ctx.fillStyle='#0FF'; ctx.fillText('PRESS SPACE OR TAP TO START', W/2, H/2+30); }
    ctx.font='14px monospace'; ctx.fillStyle='#FFF'; ctx.fillText('-- SCORE TABLE --', W/2, H/2+80);
    ctx.fillStyle='#0F0'; ctx.fillText('Boss Galaga   150  400', W/2, H/2+105);
    ctx.fillStyle='#F00'; ctx.fillText('Butterfly      80  160', W/2, H/2+125);
    ctx.fillStyle='#FF0'; ctx.fillText('Bee            50  100', W/2, H/2+145);
    ctx.font='10px monospace'; ctx.fillStyle='#888'; ctx.fillText('IN FORMATION  DIVING', W/2, H/2+165);
    drawHUD();
}

// Game over
function drawGameOver() {
    ctx.font='bold 24px monospace'; ctx.textAlign='center';
    ctx.fillStyle='#F00'; ctx.fillText('GAME OVER', W/2, H/2-40);
    ctx.font='14px monospace'; ctx.fillStyle='#FFF';
    ctx.fillText('SHOTS FIRED: '+shotsFired, W/2, H/2+10);
    ctx.fillText('HITS: '+shotsHit, W/2, H/2+30);
    const ratio = shotsFired>0 ? Math.floor((shotsHit/shotsFired)*100) : 0;
    ctx.fillStyle='#FF0'; ctx.fillText('HIT RATIO: '+ratio+'%', W/2, H/2+50);
    if (gameOverTimer<120) { ctx.fillStyle='#0FF'; ctx.fillText('PRESS SPACE TO CONTINUE', W/2, H/2+90); }
}

// Main update
function update() {
    frame++; updateStars();
    if (gameState==='title') { if (keyFire()||keys['Enter']) { ensureAudio(); startGame(); } return; }
    if (gameState==='stageIntro') { stageTimer--; if (stageTimer<=0) { gameState='playing'; spawnWave(); } return; }
    if (gameState==='gameOver') { gameOverTimer--; if (gameOverTimer<=-60&&(keyFire()||keys['Enter'])) gameState='title'; return; }
    if (gameState==='playerDying') {
        respawnTimer--; explosions.forEach(e=>e.update()); explosions=explosions.filter(e=>!e.done);
        enemies.forEach(e=>e.update()); updateEntries();
        if (respawnTimer<=0) {
            if (lives<=0) { gameState='gameOver'; gameOverTimer=180; }
            else { gameState='respawning'; respawnTimer=60; player=new Player(); }
        }
        return;
    }
    if (gameState==='respawning') {
        respawnTimer--;
        if (respawnTimer<=0) gameState='playing';
        if (player) player.update();
        enemies.forEach(e=>e.update()); updateEntries(); return;
    }
    if (gameState!=='playing') return;
    formationX = Math.sin(frame*0.012)*20;
    if (player) player.update();
    playerBullets.forEach(b => b.y -= 8);
    playerBullets = playerBullets.filter(b => b.y > -10);
    enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
    enemyBullets = enemyBullets.filter(b => b.y<H+10&&b.y>-10&&b.x>-10&&b.x<W+10);
    updateEntries();
    enemies.forEach(e => e.update());
    checkCollisions();
    explosions.forEach(e=>e.update()); explosions=explosions.filter(e=>!e.done);
    scorePopups.forEach(s=>s.update()); scorePopups=scorePopups.filter(s=>s.timer>0);
    if (enemies.length===0 && entryQueue.length===0) { stage++; startStageIntro(); }
}

// Main draw
function draw() {
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); drawStars();
    if (gameState==='title') { drawTitle(); return; }
    if (gameState==='stageIntro') { drawStageIntro(); return; }
    enemies.forEach(e=>e.draw());
    if (player && (gameState==='playing'||gameState==='respawning')) {
        if (gameState==='respawning'&&frame%6<3) {} else player.draw();
    }
    ctx.fillStyle='#FFF';
    playerBullets.forEach(b => ctx.fillRect(b.x-1, b.y-6, 2, 12));
    enemyBullets.forEach(b => { ctx.fillStyle='#FF0'; ctx.beginPath(); ctx.arc(b.x,b.y,2,0,Math.PI*2); ctx.fill(); });
    explosions.forEach(e=>e.draw());
    scorePopups.forEach(s=>s.draw());
    drawHUD();
    if (gameState==='gameOver') drawGameOver();
}

// Game flow
function startGame() {
    score=0; stage=1; lives=3; frame=0; shotsFired=0; shotsHit=0; isDualShip=false;
    playerBullets=[]; enemyBullets=[]; explosions=[]; scorePopups=[];
    player = new Player(); playSfx('stageStart'); startStageIntro();
}
function startStageIntro() {
    gameState='stageIntro'; stageTimer=120; enemyBullets=[]; playerBullets=[];
}

// Loop
let lastTime = 0, accumulator = 0;
const TICK = 1000/60;
function loop(ts) {
    if (lastTime) accumulator += Math.min(ts-lastTime, 100);
    lastTime = ts;
    while (accumulator >= TICK) { update(); accumulator -= TICK; }
    draw();
    requestAnimationFrame(loop);
}

initStars();
requestAnimationFrame(loop);

canvas.addEventListener('click', () => {
    ensureAudio();
    if (gameState==='title') startGame();
    else if (gameState==='gameOver'&&gameOverTimer<120) gameState='title';
});
canvas.addEventListener('touchstart', e => {
    e.preventDefault(); ensureAudio();
    if (gameState==='title') startGame();
});
</script>
